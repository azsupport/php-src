# tools/repology-map.conf - what Repology is asked for each port of azsupport/ports
# (tools/repology-fetch.sh), a sed -E script, one origin per line in and out.
#
# In: the origin of a port of azsupport/ports (category/port), or for a library of
# azsupport the FreeBSD port deps.conf or curl-deps.conf names (azsupport:<name>
# when neither names one). Out, after every rule below, in this order:
#   category/port       a port of the FreeBSD ports tree: Repology's project of it
#                       (tools/project-by, repo freebsd, srcname)
#   project:<name>      that project of Repology
#   -:<why>             nothing asked, for this reason
# An origin no rule changes is asked as it is: a port that is in the FreeBSD tree
# under its own origin needs no rule. The rules are for our ports that are not
# there, or whose software is that of another port: each with its reason above it.

# The extensions of php-src (built from the source of PHP, with phpize, one package
# per extension) and its SAPIs (php-fpm, php-cgi, mod_php): their software is PHP
# itself, the php package of every distribution (Repology names the FreeBSD
# phpXY-<ext> packages php:<ext>, together with the PECL releases of the same name:
# php:zip, php:xmlrpc, ...). The variants of ours (-openssl: on the OpenSSL of the
# base system; -openssl-legacy; gd-t1lib of PHP 5.6) too.
s#^[a-z0-9-]+/php([0-9][0-9])-(bcmath|bz2|calendar|ctype|curl|dba|dom|exif|ffi|fileinfo|filter|ftp|gd|gettext|gmp|hash|iconv|intl|json|mbstring|mysql|mysqli|mysqlnd|opcache|openssl|pcntl|pdo|pdo_mysql|pdo_sqlite|phar|posix|readline|session|shmop|simplexml|soap|sockets|sodium|sqlite3|sysvmsg|sysvsem|sysvshm|tidy|tokenizer|wddx|xml|xmlreader|xmlrpc|xmlwriter|xsl|zip|zlib)(-openssl|-openssl-legacy|-legacy|-t1lib)?$#lang/php\1#
s#^www/php([0-9][0-9])-(fpm|cgi)$#lang/php\1#
s#^www/mod_php([0-9][0-9])$#lang/php\1#
# PHP 5.6, 7.4 and 8.1 are no longer in the FreeBSD tree (end of life)
s#^lang/php(56|74|81)$#project:php#

# PECL and the other extensions: ours per PHP version (phpXY-<ext>), in the FreeBSD
# tree one flavored port each (php-redis, pecl-memcached, ...) or none any more
s#^databases/php[0-9][0-9]-redis(-lz4|-zstd|-lz4-zstd)?$#databases/php-redis#
s#^databases/php[0-9][0-9]-memcache$#databases/pecl-memcache#
s#^databases/php[0-9][0-9]-memcached$#databases/pecl-memcached#
s#^converters/php[0-9][0-9]-igbinary$#converters/pecl-igbinary#
# imagick6, imagick7: the one PECL imagick, on ImageMagick 6 or 7
s#^graphics/php[0-9][0-9]-imagick[67]$#graphics/pecl-imagick#
s#^devel/php[0-9][0-9]-swoole(-openssl)?$#devel/php-swoole#
s#^devel/php[0-9][0-9]-excimer$#devel/pecl-excimer#
s#^devel/php[0-9][0-9]-ioncube$#devel/ioncube#
s#^devel/php[0-9][0-9]-composer$#devel/php-composer#
s#^security/php[0-9][0-9]-ssh2$#security/pecl-ssh2#
s#^security/php[0-9][0-9]-mcrypt$#security/pecl-mcrypt#
# not in the FreeBSD tree: the project of the PECL extension (php:<name>)
s#^graphics/php[0-9][0-9]-gmagick$#project:php:gmagick#
s#^devel/php[0-9][0-9]-gearman$#project:php:gearman#
s#^devel/php[0-9][0-9]-openswoole(-openssl)?$#project:php:openswoole#
# phpMyAdmin 5 for one PHP: the flavors of databases/phpmyadmin5
s#^databases/phpmyadmin5-php[0-9][0-9]$#databases/phpmyadmin5#

# -openssl: our variant of a port on the OpenSSL of the base system (the same
# software; after the PHP rules, where php*-openssl is the extension openssl)
s#^([a-z0-9-]+/[A-Za-z0-9_.+-]+)-openssl$#\1#

# The package of the libraries of azsupport: each library is asked by itself
# (azsupport:<name>, the port of deps.conf)
s#^azsupport/azsupport$#-:the package of the libraries of azsupport (each library has rows of its own: azsupport:<name>)#
# the libcurl of azsupport (deps.conf "lib curl bundle"): curl of curl.conf
s#^azsupport:curl$#ftp/curl#

# Ours only, the same software in another port of the FreeBSD tree
# Node.js 18 and its npm, Yarn (www/node18 went from the tree on 2025-09-03)
s#^www/node18$#www/node24#
s#^www/npm-node18$#www/npm-node24#
s#^www/yarn-node18$#www/yarn-node24#
# corepack: the official www/corepack as a port of ours, for node24 and node18
s#^www/corepack-node(18|24)$#www/corepack#
# the modules of nginx that are nginx's own (http_dav, stream, image_filter): nginx
s#^www/nginx-devel-(dav|stream|image-filter)$#www/nginx-devel#
# the third-party modules of nginx: their nginx-module-* ports
s#^www/nginx-devel-(cache-purge|dav-ext|lua|passenger|vod|vts)$#www/nginx-module-\1#
s#^www/nginx-devel-stream-lua$#www/nginx-module-lua-stream#
# testcookie-nginx-module: in the FreeBSD tree only for Angie
s#^www/nginx-devel-testcookie$#www/angie-module-testcookie#
s#^www/lua-resty-string$#devel/lua-resty-string#
s#^www/apache24-suexec$#www/apache24#
s#^www/aria2-ssh2$#www/aria2#
s#^mail/dovecot-mysql$#mail/dovecot#
s#^mail/postfix-mysql$#mail/postfix#
s#^lang/gcc16-libs$#lang/gcc16#
# Tcl 8.4: the project of Tcl (lang/tcl86)
s#^lang/tcl84$#lang/tcl86#
# the libraries of ImageMagick 6 and 7, packages of their own
s#^graphics/libimagemagick([67])$#graphics/ImageMagick\1#
s#^graphics/ImageMagick67$#-:the programs of ImageMagick 7 and 6 in one package, two versions in one (see graphics/ImageMagick7 and graphics/ImageMagick6)#
# qt-faststart: a tool of the source of FFmpeg (tools/qt-faststart.c of its release)
s#^multimedia/qt-faststart$#multimedia/ffmpeg#
# Elasticsearch 6, Kibana 6, OpenSearch and Dashboards 2.17: the projects of the
# current ports
s#^textproc/elasticsearch6$#textproc/elasticsearch8#
s#^textproc/kibana6$#textproc/kibana8#
s#^textproc/opensearch217$#textproc/opensearch#
s#^textproc/opensearch-dashboards217$#textproc/opensearch-dashboards#

# Ours only, not in the FreeBSD tree: the project of Repology by its name
s#^devel/(gearmand|libgearman)$#project:gearmand#
s#^textproc/manticore(14|32)$#project:manticoresearch#
s#^textproc/manticore(14|32)-columnar$#project:manticore-columnar-lib#
s#^net-im/rocketchat8$#project:rocketchat-server#
s#^converters/lua51-base64$#project:lua:lbase64#
s#^graphics/lua51-vips$#project:lua:vips#
