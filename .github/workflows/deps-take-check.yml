name: phpdeps take check
# Do the patches of a port still apply to the upstream release of its take line in
# freebsd/deps.conf? tools/deps-take-check.sh on Ubuntu (a minute): the result of
# each patch, the failed hunks with the files they are for, and the patches written
# again against the release (artifact deps-take-check).
# Started by hand: Actions, "phpdeps take check", "Run workflow".
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Libraries, separated by spaces (empty: every take line)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check the patches
        env:
          NAMES: ${{ inputs.names }}
        run: |
          # shellcheck disable=SC2086
          sh tools/deps-take-check.sh $NAMES
      - name: Patches against the releases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-take-check
          path: deps-take-check/
          if-no-files-found: ignore
