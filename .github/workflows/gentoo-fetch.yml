name: Gentoo fetch

# The history of package directories of the Gentoo tree, with the files it removed
# (ebuilds of versions Gentoo dropped, their patches of files/) and the patch sets
# the ebuilds download, now or before (tools/gentoo-fetch.py): a fix for a version or
# a branch Gentoo no longer has (PHP 7.4, 8.1, ImageMagick 6) is only in that
# history, and a patch set only on distfiles.gentoo.org or dev.gentoo.org, which the
# sandbox of Claude Code cannot reach. From a full clone of gentoo/gentoo, into the
# branch runs of azsupport/azsupport (secret RUNS_TOKEN), distro/gentoo/<YYYY-MM-DD>/
# <cat>/<pkg>/ (log.txt, recent.md, removed/, removed.tsv, patchsets/,
# patchsets.txt) and <run id>.md (the report, also the summary of the run).
# Started by hand: Actions, "Gentoo fetch", "Run workflow", or
#   gh api -X POST repos/azsupport/php-src/actions/workflows/gentoo-fetch.yml/dispatches \
#     -f ref=master -f 'inputs[dirs]=dev-lang/php media-gfx/imagemagick'

on:
  workflow_dispatch:
    inputs:
      dirs:
        description: 'Package directories of gentoo/gentoo, separated by spaces (dev-lang/php net-misc/curl ...; also removed ones)'
        required: true
        type: string
      since:
        description: 'recent.md: the commits after this day (YYYY-MM-DD; empty: 7 days ago)'
        required: false
        type: string
        default: ''
      skip_dist:
        description: 'A regular expression: DIST files not to download (patch sets mirrored on GitHub, as ^gcc-)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Fetch and push to azsupport/azsupport (branch runs)
        id: fetch
        env:
          DIRS: ${{ inputs.dirs }}
          SINCE: ${{ inputs.since }}
          SKIP_DIST: ${{ inputs.skip_dist }}
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
        run: |
          set -f
          rc=0
          # shellcheck disable=SC2086
          python3 -I tools/gentoo-fetch.py --out "$RUNNER_TEMP/gentoo" --report report.md \
            --since "$SINCE" --skip-dist "$SKIP_DIST" --push -- $DIRS || rc=$?
          [ ! -s report.md ] || cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Report
        if: always()
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: dirs=${{ inputs.dirs }} since=${{ inputs.since }} skip_dist=${{ inputs.skip_dist }}
          RUNS_STEPS: fetch=${{ steps.fetch.outcome }}
        run: |
          [ -s report.md ] || printf '### Gentoo fetch\n\nNo report: the step Fetch ended before writing one (its log).\n' > report.md
          sh tools/runs-report.sh report.md fetch
