name: take sources
# Is the file of a take line the same from every source? tools/take-sources.sh on
# Ubuntu (a few minutes): every address of the take line (the port's MASTER_SITES)
# and the asset of the GitHub release, the size and SHA-256 of each, the
# publisher's checksums and signature; when the files differ, their trees against
# each other and against the git tag. The report goes into the branch runs of
# azsupport/azsupport (tools/runs-report.sh) and into the summary of the run.
# Started by hand: Actions, "take sources", "Run workflow", or gh api.
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Names of take lines (freebsd/*.conf), separated by spaces'
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check the sources
        id: check
        env:
          NAMES: ${{ inputs.names }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          # shellcheck disable=SC2086
          sh tools/take-sources.sh $NAMES || rc=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Report to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: names=${{ inputs.names }}
          RUNS_STEPS: check=${{ steps.check.outcome }}
        run: sh tools/runs-report.sh report.md sources
