name: az packages for FreeBSD

# Builds the static packages of the fork (tools/build-az.sh) from the FreeBSD
# ports, with the compiler flags of the servers for an x86-64 level: azsupport (the
# static libraries of /usr/local/azsupport that PHP and the programs are built against,
# freebsd/deps.conf), and in the place of the packages of the ports curl (bin/curl,
# libcurl.so.4), ffmpeg (freebsd/ffmpeg.conf), ImageMagick6 (convert6, ...) and
# ImageMagick7 (freebsd/imagemagick.conf); installs and tests them, one job per
# level, and publishes their repository of pkg as the files of the release
# az-fbsd<major>-amd64-<level> (or, for a check on a server first,
# az-fbsd<major>-amd64-<level>-candidate): its address goes into
# /usr/local/etc/pkg/repos/az.conf (sh tools/az-menu.sh --repo writes it).
# Started by hand: Actions, "az packages for FreeBSD", "Run workflow".

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
      cputype:
        description: 'x86-64 level (-march, CPUTYPE of make.conf)'
        type: choice
        options: [both, x86-64-v3, x86-64-v2]
        default: both
      cflags:
        description: 'CFLAGS of make.conf (the protections are added)'
        required: true
        default: '-O3 -pipe'
      publish:
        description: 'Publish the repository when everything built and every test passed'
        type: boolean
        default: true
      candidate:
        description: 'Publish to az-fbsd<major>-amd64-<level>-candidate (a pre-release, for a check on a server), not to the release the servers read'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: az-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        cputype: ${{ inputs.cputype == 'both' && fromJSON('["x86-64-v3", "x86-64-v2"]') || fromJSON(format('["{0}"]', inputs.cputype)) }}
    name: az (${{ matrix.cputype }})
    steps:
      - uses: actions/checkout@v5

      - name: The PHP packages of the release (az-php.yml), kept in its repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
          CANDIDATE: ${{ inputs.candidate && '1' || '' }}
        run: |
          major="${RELEASE%%.*}"
          tag="az-fbsd$major-amd64-${CPUTYPE#x86-64-}${CANDIDATE:+-candidate}"
          mkdir -p php-keep
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir php-keep --pattern 'php[0-9]*.pkg' 2>/dev/null || true
          ls php-keep

      - name: Free space on the runner (the disk of the VM grows on it)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: The files of the take lines, fetched on the runner (it reaches GitHub better than the VM)
        run: sh tools/take-fetch.sh

      # the key of the repository az (the secret PKG_SIGNING_KEY, PEM) in one line for envs:
      # of the VM, masked; tools/pkg-repo-sign.sh signs with it there (no key: unsigned)
      - name: The signing key of the repository, for the VM
        id: key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          if [ -n "$PKG_SIGNING_KEY" ]; then
            b64="$(printf '%s\n' "$PKG_SIGNING_KEY" | base64 -w0)"
            echo "::add-mask::$b64"
            echo "b64=$b64" >> "$GITHUB_OUTPUT"
          else
            echo "no PKG_SIGNING_KEY: the repository will not be signed"
          fi

      - name: Build, test and package in FreeBSD ${{ inputs.release }}
        id: build
        uses: vmactions/freebsd-vm@v1
        env:
          AZ_CPUTYPE: ${{ matrix.cputype }}
          AZ_CFLAGS: ${{ inputs.cflags }}
          AZ_PKG_KEY: ${{ steps.key.outputs.b64 }}
        with:
          release: ${{ inputs.release }}
          envs: 'AZ_CPUTYPE AZ_CFLAGS AZ_PKG_KEY'
          prepare: |
            if [ -n "${AZ_PKG_KEY:-}" ]; then (umask 077 && printf '%s' "$AZ_PKG_KEY" > /root/.az-pkg-key.b64); fi; unset AZ_PKG_KEY
            sh tools/build-az.sh --tools
          run: |
            if [ -n "${AZ_PKG_KEY:-}" ]; then (umask 077 && printf '%s' "$AZ_PKG_KEY" > /root/.az-pkg-key.b64); fi; unset AZ_PKG_KEY
            trap 'rm -f /root/.az-pkg-key.b64' EXIT
            if [ -s /root/.az-pkg-key.b64 ]; then export AZ_PKG_KEY_FILE=/root/.az-pkg-key.b64; fi
            sh tools/build-az.sh || true
            r="dist/az-fbsd$(uname -r | cut -d. -f1)-amd64-${AZ_CPUTYPE#x86-64-}"
            if [ -f "$r/meta.conf" ] && ls php-keep/php*.pkg > /dev/null 2>&1; then
              cp php-keep/php*.pkg "$r/" && sh tools/pkg-repo-sign.sh "$r" az-results/repo-php.log
            fi
            # not back to the runner a second time
            rm -rf php-keep distfiles

      - name: Report
        id: report
        if: always()
        run: |
          # the summary goes to report.md first (tools/runs-report.sh commits it), then to the job summary
          summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$PWD/report.md"
          : > report.md
          rc=0
          sh tools/build-deps-report.sh deps-results || rc=1
          sh tools/build-ffmpeg-report.sh ffmpeg-results "FFmpeg" || rc=1
          sh tools/build-ffmpeg-report.sh imagemagick-results "ImageMagick 6 and 7" || rc=1
          sh tools/build-ffmpeg-report.sh curl-results "curl" || rc=1
          sh tools/build-ffmpeg-report.sh az-results "the packages of /usr/local/azsupport" || rc=1
          # the catalog: signed and checked, or not (the last line of tools/pkg-repo-sign.sh)
          for l in az-results/repo.log az-results/repo-php.log; do
            [ -s "$l" ] || continue
            printf '\n%s: %s\n' "${l##*/}" "$(tail -n 1 "$l")" | tee -a report.md
            tail -n 1 "$l" | grep -q '^pkg repo failed' && rc=1
          done
          cat report.md >> "$summary"
          exit $rc

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: az-results-${{ matrix.cputype }}
          path: |
            az-results/
            deps-results/
            ffmpeg-results/
            imagemagick-results/
            curl-results/
          if-no-files-found: ignore

      - name: Publish
        id: publish
        if: ${{ success() && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
          CFLAGS_IN: ${{ inputs.cflags }}
          CANDIDATE: ${{ inputs.candidate && '1' || '' }}
        run: |
          major="${RELEASE%%.*}"
          level="${CPUTYPE#x86-64-}"
          dir="dist/az-fbsd$major-amd64-$level"
          tag="az-fbsd$major-amd64-$level"
          if [ -n "$CANDIDATE" ]; then tag="$tag-candidate"; fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          notes="A repository of pkg for FreeBSD $major (amd64, -march=$CPUTYPE) of the static packages of azsupport/php-src: azsupport (the libraries of /usr/local/azsupport PHP is built against), and in the place of those of the ports curl (bin/curl, libcurl.so.4), ffmpeg, ImageMagick6 (convert6, identify6, ...) and ImageMagick7 (magick, and its libraries for imagick); the PHP packages php56 ... php84 of az-menu.sh come into it too. Built from the FreeBSD ports with $CFLAGS_IN -fstack-protector-strong -fno-strict-aliasing, PIE, RELRO and BIND_NOW. On a server, /usr/local/etc/pkg/repos/az.conf: az: { url: \"$url\", signature_type: \"pubkey\", pubkey: \"/usr/local/etc/pkg/keys/az.pub\", priority: 100, enabled: yes } with the key freebsd/az.pub of the fork (sh tools/az-menu.sh --repo writes both; the catalog is signed with the key of aZ), then: pkg update -r az, pkg install -r az ffmpeg ImageMagick7 (and the others). Versions and options: /usr/local/share/doc/<package>/VERSIONS (azsupport: /usr/local/azsupport/share/doc/azsupport/VERSIONS)."
          if [ -n "$CANDIDATE" ]; then
            notes="A candidate, for a check on a server before the packages go to az-fbsd$major-amd64-$level. $notes"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$notes" --target "$GITHUB_SHA" ${CANDIDATE:+--prerelease} ||
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          # the packages first, the catalog of pkg repo last, then away with what this build has not
          pk="$(ls "$dir" | grep -E '^(azsupport|curl|ffmpeg|ImageMagick[67])-[0-9].*\.pkg$' | sed "s#^#$dir/#")"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $pk
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber $(ls -d "$dir"/* | grep -v -E '/(azsupport|curl|ffmpeg|ImageMagick[67])-[0-9][^/]*\.pkg$')
          for a in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "$dir/$a" ] || gh release delete-asset "$tag" "$a" --repo "$GITHUB_REPOSITORY" -y
          done
          # every file of the repository is in the release under its own name
          have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for f in $(ls "$dir"); do
            printf '%s\n' "$have" | grep -qxF "$f" || { echo "not in the release $tag: $f"; exit 1; }
          done

      # the report into the branch runs of the private azsupport/azsupport (secret RUNS_TOKEN)
      - name: Report to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: release=${{ inputs.release }} cputype=${{ matrix.cputype }} cflags=${{ inputs.cflags }} candidate=${{ inputs.candidate }} publish=${{ inputs.publish }}
          RUNS_STEPS: build=${{ steps.build.outcome }} report=${{ steps.report.outcome }} publish=${{ steps.publish.outcome }}
          PART: ${{ matrix.cputype }}
        run: sh tools/runs-report.sh report.md "$PART"
