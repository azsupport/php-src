name: ImageMagick for the video sites

# Builds /usr/local/imagemagick6 and /usr/local/imagemagick7
# (tools/build-imagemagick.sh): static ImageMagick 6 and 7 programs for the video
# sites (KVS), both installable at once, with only the formats of
# freebsd/imagemagick.conf and the policy freebsd/imagemagick/policy.xml, from the
# FreeBSD ports, with the compiler flags of the servers for an x86-64 level; tests
# them as the sites use them (tools/imagemagick-test.sh) and publishes them, one
# job per level: imagemagick6-fbsd<major>-amd64-<level>.tar.xz and
# imagemagick7-..., with .sha256 and the list of versions, to the pre-release
# imagemagick-fbsd<major>-candidate (for a check on a server) or, with candidate
# off, to imagemagick-fbsd<major>-latest and a dated release.
# Started by hand: Actions, "ImageMagick for the video sites", "Run workflow".

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
      cputype:
        description: 'x86-64 level (-march, CPUTYPE of make.conf)'
        type: choice
        options: [both, x86-64-v3, x86-64-v2]
        default: both
      cflags:
        description: 'CFLAGS of make.conf (the protections are added)'
        required: true
        default: '-O3 -pipe'
      publish:
        description: 'Publish the tarballs when they built and every test passed'
        type: boolean
        default: true
      candidate:
        description: 'Publish to imagemagick-fbsd<major>-candidate only (a pre-release, for a check on a server), not to -latest'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: imagemagick-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        cputype: ${{ inputs.cputype == 'both' && fromJSON('["x86-64-v3", "x86-64-v2"]') || fromJSON(format('["{0}"]', inputs.cputype)) }}
    name: imagemagick (${{ matrix.cputype }})
    steps:
      - uses: actions/checkout@v5

      - name: Build and test in FreeBSD ${{ inputs.release }}
        uses: vmactions/freebsd-vm@v1
        env:
          IM_CPUTYPE: ${{ matrix.cputype }}
          IM_CFLAGS: ${{ inputs.cflags }}
        with:
          release: ${{ inputs.release }}
          envs: 'IM_CPUTYPE IM_CFLAGS'
          prepare: |
            sh tools/build-imagemagick.sh --tools
          run: |
            sh tools/build-imagemagick.sh && sh tools/imagemagick-test.sh || true

      - name: Report
        if: always()
        run: sh tools/build-ffmpeg-report.sh imagemagick-results "ImageMagick for the video sites"

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagemagick-results-${{ matrix.cputype }}
          path: imagemagick-results/
          if-no-files-found: ignore

      - name: Publish
        if: ${{ success() && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
          CFLAGS_IN: ${{ inputs.cflags }}
          CANDIDATE: ${{ inputs.candidate && '1' || '' }}
        run: |
          major="${RELEASE%%.*}"
          level="${CPUTYPE#x86-64-}"
          tag="imagemagick-fbsd$major-latest"
          dated="imagemagick-fbsd$major-$(date -u +%Y%m%d)"
          if [ -n "$CANDIDATE" ]; then tag="imagemagick-fbsd$major-candidate"; dated="$tag"; fi
          notes="ImageMagick 6 and 7 (static programs) for the video sites on FreeBSD $major (amd64), installable at once: /usr/local/imagemagick6/bin (convert, identify, mogrify, composite...) and /usr/local/imagemagick7/bin (magick and the same names), with only JPEG, PNG, WebP, GIF, HEIC and AVIF, text (FreeType, fontconfig of the system) and colour profiles (lcms2), and the policy freebsd/imagemagick/policy.xml. Built from the FreeBSD ports with $CFLAGS_IN -fstack-protector-strong -fno-strict-aliasing, PIE, RELRO and BIND_NOW, per x86-64 level: -v3 (-march=x86-64-v3, CPUs with AVX2) and -v2 (-march=x86-64-v2). Extract with: tar -xf imagemagick<6|7>-fbsd$major-amd64-<level>.tar.xz -C /usr/local. Versions and options: imagemagick<6|7>-fbsd$major-amd64-<level>.VERSIONS.txt."
          if [ -n "$CANDIDATE" ]; then
            notes="A candidate for imagemagick-fbsd$major-latest, for a check on a server before it is published there. $notes"
          fi
          for t in "$tag" "$dated"; do
            if ! gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$t" --repo "$GITHUB_REPOSITORY" --title "$t" --notes "$notes" --target "$GITHUB_SHA" ${CANDIDATE:+--prerelease} ||
                gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null
            fi
            gh release edit "$t" --repo "$GITHUB_REPOSITORY" --notes "$notes"
            for im in imagemagick6 imagemagick7; do
              name="$im-fbsd$major-amd64-$level"
              gh release upload "$t" --repo "$GITHUB_REPOSITORY" --clobber \
                "dist/$name.tar.xz" "dist/$name.tar.xz.sha256" "dist/$name.VERSIONS.txt"
            done
          done
