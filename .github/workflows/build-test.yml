name: Build test on FreeBSD

# Builds the freebsd-<version>-latest release tarballs in a FreeBSD VM with the
# configure options of our servers (tools/build-test.sh) and reports the result
# on the run page: one annotation per version, details in the job summary.
# Started by hand only: Actions, "Build test on FreeBSD", "Run workflow".

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Versions, separated by spaces: 5.6 7.4 8.1 8.2 8.3 8.4'
        required: true
        default: '5.6 7.4'
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
      tests:
        description: 'Also run a part of the PHP test suite'
        type: boolean
        default: true
      swoole:
        description: 'For 7.4 and newer: build swoole or OpenSwoole (one of the two)'
        type: choice
        options: [swoole, openswoole]
        default: swoole
      magick:
        description: 'Build imagick or gmagick (one of the two), or none'
        type: choice
        options: [imagick, gmagick, none]
        default: imagick
      deps:
        description: 'Build against /usr/local/phpdeps (release phpdeps-fbsd<major>-latest) instead of pkg libraries'
        type: boolean
        default: false
      configure:
        description: 'More configure options for every version, separated by spaces (e.g. --enable-zend-signals)'
        required: false
        default: ''

permissions:
  contents: read

# One run per variant at a time. GitHub keeps only one waiting run per group and
# cancels the one that waited before, so the variants (swoole/openswoole,
# imagick/gmagick, tests) get groups of their own and run side by side.
concurrency:
  group: build-test-${{ inputs.swoole || 'swoole' }}-${{ inputs.magick || 'imagick' }}-${{ inputs.tests && 'tests' || 'build' }}-${{ inputs.deps && 'deps' || 'pkg' }}-${{ inputs.configure }}
  cancel-in-progress: false

jobs:
  freebsd:
    runs-on: ubuntu-latest
    # the builds and, with tests, up to 25 minutes of tests per version (60 for 5.6)
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Download the release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ inputs.targets }}
        run: |
          mkdir -p dist
          for t in $TARGETS; do
            gh release download "freebsd-$t-latest" --repo "$GITHUB_REPOSITORY" --dir dist \
              --pattern "php-$t-fbsd-latest.tar.xz" --pattern "php-$t-fbsd-latest.tar.xz.sha256"
          done
          cd dist && sha256sum -c ./*.sha256

      - name: Download /usr/local/phpdeps
        if: ${{ inputs.deps }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          major="${RELEASE%%.*}"
          mkdir -p deps-dist
          gh release download "phpdeps-fbsd$major-latest" --repo "$GITHUB_REPOSITORY" --dir deps-dist \
            --pattern "phpdeps-fbsd$major-amd64-*.tar.xz" --pattern "phpdeps-fbsd$major-amd64-*.tar.xz.sha256"
          cd deps-dist
          for f in phpdeps-fbsd$major-amd64-*.tar.xz; do
            echo "$(cat "$f.sha256")  $f" | sha256sum -c || exit 1
          done

      - name: Build in FreeBSD ${{ inputs.release }}
        uses: vmactions/freebsd-vm@v1
        env:
          TARGETS: ${{ inputs.targets }}
          TESTS: ${{ inputs.tests && '--tests' || '' }}
          SWOOLE: ${{ inputs.swoole }}
          MAGICK: ${{ inputs.magick }}
          PHPDEPS_BUNDLE: ${{ inputs.deps && '1' || '0' }}
          EXTRA_CONFIGURE: ${{ inputs.configure }}
        with:
          release: ${{ inputs.release }}
          envs: 'TARGETS TESTS SWOOLE MAGICK PHPDEPS_BUNDLE EXTRA_CONFIGURE'
          prepare: |
            if [ "$PHPDEPS_BUNDLE" = 1 ]; then sh tools/build-test.sh --phpdeps deps-dist; fi
            sh tools/build-test.sh --deps $TARGETS
          run: |
            sh tools/build-test.sh $TESTS $TARGETS || true

      - name: Report
        if: always()
        run: sh tools/build-test-report.sh build-test-results
