name: Upstream check

# Once a day: newer releases of the bundled PECL extensions, curl, the libraries
# of curl and PCRE2; FreeBSD ports commits that change the patches or the build
# of these and of PHP, and release files in their distinfo that the bundle has
# not; the end of security support of the PHP branches taken from php-src tags;
# for t1lib (devel/t1lib of azsupport/ports, no upstream since 2007) the commits of
# Gentoo to media-libs/t1lib and the new CVEs of NVD that name it; a switch of the
# default version of Python or Perl of the ports tree (PYTHON_DEFAULT, PERL5_DEFAULT
# of Mk/bsd.default-versions.mk: our python312 and perl5 of azsupport/ports).
# Each finding opens or updates one issue (label "upstream"); nothing is applied.
# Closing an issue means "not wanted", the check does not reopen it.
# What is followed: freebsd/pecl.conf, freebsd/curl.conf, freebsd/curl-deps.conf,
# freebsd/pcre.conf, freebsd/targets.conf, freebsd/upstream.conf, php.net; and the
# libraries of az, FFmpeg and ImageMagick by the conf files of azsupport/ports
# (az/az/files/deps.conf, multimedia/ffmpeg/files/ffmpeg.conf,
# graphics/ImageMagick7/files/imagemagick.conf), checked out into ports/.
# By hand: Actions, "Upstream check", "Run workflow".

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the findings, do not touch issues'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # the conf files of the bundles (the packages az, ffmpeg, ImageMagick6 and 7)
      - uses: actions/checkout@v5
        with:
          repository: azsupport/ports
          path: ports
          persist-credentials: false

      - name: Check releases and FreeBSD ports
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 tools/upstream-check.py --repo "$GITHUB_REPOSITORY" --ports ports $DRY_RUN
