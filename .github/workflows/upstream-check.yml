name: Upstream check

# Once a day: newer releases of the bundled PECL extensions, curl, the libraries
# of curl and PCRE2; FreeBSD ports commits that change the patches or the build
# of these and of PHP, and release files in their distinfo that the bundle has
# not; the end of security support of the PHP branches taken from php-src tags;
# for t1lib (devel/t1lib of azsupport/ports, no upstream since 2007) the new CVEs of
# NVD that name it; a switch of the default version of Python or Perl of the ports
# tree (PYTHON_DEFAULT, PERL5_DEFAULT of Mk/bsd.default-versions.mk: our python312
# and perl5 of azsupport/ports). What other distributions changed after the date of
# their rows in freebsd/upstream.conf (their fixes, often to old versions): the
# commits that landed in the trees of Gentoo, OpenBSD, NixOS, MacPorts, Homebrew,
# Alpine, Void, pkgsrc and in the branches of the "tree" rows (OpenEmbedded,
# Buildroot, Wolfi, Photon OS, OpenWrt), read with git (commits only, then the trees
# of the commits compared: no file contents, no API calls); the dist-git
# repositories of Fedora, CentOS Stream and AlmaLinux; the packaging repositories of
# Arch Linux (gitlab.archlinux.org) and the AUR (its GitHub mirror, "github" rows);
# the ChangeLog.txt of Slackware (signature checked); Remi Collet's git server; the
# .changes of openSUSE and SUSE (Open Build Service); the advisories and uploads of
# Debian, Ubuntu and the PPA of Ondrej Sury.
# Each finding opens or updates one issue (label "upstream"); nothing is applied.
# Closing an issue means "not wanted", the check does not reopen it.
# What is followed: freebsd/pecl.conf, freebsd/curl.conf, freebsd/curl-deps.conf,
# freebsd/pcre.conf, freebsd/targets.conf, freebsd/upstream.conf, php.net; and the
# libraries of az, FFmpeg and ImageMagick by the conf files of azsupport/ports
# (az/az/files/deps.conf, multimedia/ffmpeg/files/ffmpeg.conf,
# graphics/ImageMagick7/files/imagemagick.conf), checked out into ports/.
# By hand: Actions, "Upstream check", "Run workflow". A test of rows not yet in
# upstream.conf: dry run with the input rows, e.g. by the API:
#   gh api -X POST repos/azsupport/php-src/actions/workflows/upstream-check.yml/dispatches \
#     -f ref=master -F 'inputs[dry_run]=true' -f 'inputs[rows]=fedora unzip 2026-11-12 archivers/unzip'
# and only some of the checks: -f 'inputs[only]=trees,slackware' (the names: --help of
# tools/upstream-check.py).

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the findings, do not touch issues'
        type: boolean
        default: false
      rows:
        description: 'Rows to check besides freebsd/upstream.conf, separated by ";" (a test of new rows, with dry run)'
        type: string
        default: ''
      only:
        description: 'Only these checks, separated by commas (trees, slackware, remi, arch, suse, debian ...; empty: all)'
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # the conf files of the bundles (the packages az, ffmpeg, ImageMagick6 and 7)
      - uses: actions/checkout@v5
        with:
          repository: azsupport/ports
          path: ports
          persist-credentials: false

      - name: Check releases and FreeBSD ports
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          UPSTREAM_EXTRA_ROWS: ${{ inputs.rows }}
          ONLY: ${{ inputs.only }}
        run: python3 tools/upstream-check.py --repo "$GITHUB_REPOSITORY" --ports ports --only "$ONLY" $DRY_RUN
