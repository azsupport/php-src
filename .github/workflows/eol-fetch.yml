name: EOL fetch

# The support dates of the release cycles of upstream projects (endoflife.date: every
# product, with the active and the security support of each cycle, LTS, its latest
# release and the date of it) and, with the input git, the releases of upstream
# projects (the tags of their git repositories with their dates, or the names of a
# download listing ending in "/"), by tools/facts-fetch.py eol. The site is closed to
# the sandbox of Claude Code, GitHub is not: the files go into the branch runs of the
# private azsupport/azsupport (secret RUNS_TOKEN), distro/eol/<YYYY-MM-DD>/<run id>.json
# and .md, the report of the run into eol-fetch/<YYYY-MM-DD>/<run id>-fetch.md there
# (tools/runs-report.sh); db/upstream.tsv of that repository is made from them.
# Started by hand (Actions, "EOL fetch", "Run workflow") or by the API:
#   gh api -X POST repos/azsupport/php-src/actions/workflows/eol-fetch.yml/dispatches \
#     -f ref=master -f 'inputs[git]=https://github.com/nginx/nginx https://ftp.gnu.org/gnu/readline/'

run-name: EOL fetch

on:
  workflow_dispatch:
    inputs:
      git:
        description: 'Upstream sources (git repositories, listings ending in /), separated by spaces'
        required: false
        type: string
        default: ''
      products:
        description: 'Only these products of endoflife.date, separated by spaces (empty: all)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: eol-fetch

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: endoflife.date and the upstream releases, pushed to azsupport/azsupport (branch runs)
        id: fetch
        env:
          GIT_SOURCES: ${{ inputs.git }}
          PRODUCTS: ${{ inputs.products }}
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
        run: |
          set -f
          printf '%s\n' $GIT_SOURCES > "$RUNNER_TEMP/git.txt"
          printf '%s\n' $PRODUCTS > "$RUNNER_TEMP/products.txt"
          python3 -I tools/facts-fetch.py eol --git "$RUNNER_TEMP/git.txt" --products "$RUNNER_TEMP/products.txt" \
            --out "$RUNNER_TEMP/out" --report report.md --push

      - name: Report
        if: always()
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_STEPS: fetch=${{ steps.fetch.outcome }}
        run: |
          [ -s report.md ] || printf '### EOL fetch\n\nNo report: the step before ended before writing one (its log).\n' > report.md
          sh tools/runs-report.sh report.md fetch
