name: FFmpeg for the video sites (kvs-media)

# Builds /usr/local/kvs-media (tools/build-ffmpeg.sh): ffmpeg and ffprobe for the
# video sites (KVS) with only the formats, codecs and protocols of
# freebsd/ffmpeg.conf, from the FreeBSD ports, with the compiler flags of the
# servers for an x86-64 level; tests it as the sites use it (tools/ffmpeg-test.sh)
# and publishes it, one job per level: kvs-media-fbsd<major>-amd64-<level>.tar.xz,
# .sha256 and the list of versions, to the pre-release
# kvs-media-fbsd<major>-candidate (for a check on a server) or, with candidate
# off, to kvs-media-fbsd<major>-latest and a dated release.
# Started by hand: Actions, "FFmpeg for the video sites (kvs-media)", "Run workflow".

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
      cputype:
        description: 'x86-64 level (-march, CPUTYPE of make.conf)'
        type: choice
        options: [both, x86-64-v3, x86-64-v2]
        default: both
      cflags:
        description: 'CFLAGS of make.conf (the protections are added)'
        required: true
        default: '-O3 -pipe'
      publish:
        description: 'Publish the tarball when it built and every test passed'
        type: boolean
        default: true
      candidate:
        description: 'Publish to kvs-media-fbsd<major>-candidate only (a pre-release, for a check on a server), not to -latest'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: kvs-media-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        cputype: ${{ inputs.cputype == 'both' && fromJSON('["x86-64-v3", "x86-64-v2"]') || fromJSON(format('["{0}"]', inputs.cputype)) }}
    name: kvs-media (${{ matrix.cputype }})
    steps:
      - uses: actions/checkout@v5

      - name: Build and test in FreeBSD ${{ inputs.release }}
        uses: vmactions/freebsd-vm@v1
        env:
          FFMPEG_CPUTYPE: ${{ matrix.cputype }}
          FFMPEG_CFLAGS: ${{ inputs.cflags }}
        with:
          release: ${{ inputs.release }}
          envs: 'FFMPEG_CPUTYPE FFMPEG_CFLAGS'
          prepare: |
            sh tools/build-ffmpeg.sh --tools
          run: |
            sh tools/build-ffmpeg.sh && sh tools/ffmpeg-test.sh || true

      - name: Report
        if: always()
        run: sh tools/build-ffmpeg-report.sh ffmpeg-results

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-results-${{ matrix.cputype }}
          path: ffmpeg-results/
          if-no-files-found: ignore

      - name: Publish
        if: ${{ success() && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          CPUTYPE: ${{ matrix.cputype }}
          CFLAGS_IN: ${{ inputs.cflags }}
          CANDIDATE: ${{ inputs.candidate && '1' || '' }}
        run: |
          major="${RELEASE%%.*}"
          level="${CPUTYPE#x86-64-}"
          tag="kvs-media-fbsd$major-latest"
          name="kvs-media-fbsd$major-amd64-$level"
          dated="kvs-media-fbsd$major-$(date -u +%Y%m%d)"
          if [ -n "$CANDIDATE" ]; then tag="kvs-media-fbsd$major-candidate"; dated="$tag"; fi
          notes="FFmpeg (ffmpeg and ffprobe) for the video sites on FreeBSD $major (amd64), with only the formats, codecs and protocols of freebsd/ffmpeg.conf: no network, no playlists. Built from the FreeBSD ports with $CFLAGS_IN -fstack-protector-strong -fno-strict-aliasing, LTO, PIE, RELRO and BIND_NOW, one tarball per x86-64 level: kvs-media-fbsd$major-amd64-v3.tar.xz (-march=x86-64-v3, CPUs with AVX2) and kvs-media-fbsd$major-amd64-v2.tar.xz (-march=x86-64-v2). Extract the one of the server's CPU with: tar -xf kvs-media-fbsd$major-amd64-<level>.tar.xz -C /usr/local (gives /usr/local/kvs-media/bin/ffmpeg and ffprobe). Versions, patches and the configure options: kvs-media-fbsd$major-amd64-<level>.VERSIONS.txt."
          if [ -n "$CANDIDATE" ]; then
            notes="A candidate for kvs-media-fbsd$major-latest, for a check on a server before it is published there. $notes"
          fi
          for t in "$tag" "$dated"; do
            if ! gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$t" --repo "$GITHUB_REPOSITORY" --title "$t" --notes "$notes" --target "$GITHUB_SHA" ${CANDIDATE:+--prerelease} ||
                gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null
            fi
            gh release edit "$t" --repo "$GITHUB_REPOSITORY" --notes "$notes"
            gh release upload "$t" --repo "$GITHUB_REPOSITORY" --clobber \
              "dist/$name.tar.xz" "dist/$name.tar.xz.sha256" "dist/$name.VERSIONS.txt"
          done
