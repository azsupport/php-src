name: PHP benchmark on FreeBSD

# Compares the speed of PHP built in different ways: the CLI of the newest dated
# release tarball of each version, built in a FreeBSD VM by the variants asked (the
# base clang, GCC of the packages, GCC with LTO, with PGO, the clang of the newest
# llvm package...), then Zend/bench.php and Zend/micro_bench.php of the same tree
# without OPcache, with OPcache (on 8.x with the tracing JIT) and with the huge pages
# of the Zend allocator, and the tests of each variant (run-tests.php on Zend/tests and
# two directories of ext/standard) against those of the variant it is compared with.
# One job and one VM per version: all variants of a version are built and run in the
# same VM, so that their numbers compare. The script, bench.sh, is kept in the private
# azsupport/azsupport (tests/php-src/), fetched with RUNS_TOKEN; its report goes into
# the branch runs there (tools/runs-report.sh), the log of the job says only whether
# each version gave one. Publishes nothing.
# Started by hand: Actions, "PHP benchmark on FreeBSD", "Run workflow", or
# gh api -X POST repos/azsupport/php-src/actions/workflows/bench.yml/dispatches -f ref=master
#   -f 'inputs[versions]=5.6 7.4 8.1 8.2 8.3 8.4' -f 'inputs[variants]=base gcc gcc-lto'

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'PHP versions, separated by spaces (one job and VM each)'
        required: true
        default: '5.6 7.4 8.1 8.2 8.3 8.4'
      variants:
        description: 'The variants (BENCH_VARIANTS of bench.sh: base base-pgo base-nsi llvm llvm-pgo llvm-pgo-lto gcc gcc-pgo gcc-lto gcc-nsi gcc-nsi-lto); the first is the baseline'
        required: true
        default: 'base gcc gcc-lto'
      repeat:
        description: 'Runs of each benchmark per variant and mode (the report gives the median)'
        required: true
        default: '5'
      tests:
        description: 'The tests of each variant (run-tests.php), compared'
        type: boolean
        default: true
      embed:
        description: 'Also through a shared libphp (the embed SAPI built shared, as mod_php)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: The versions as a list for the matrix
        id: list
        env:
          VERSIONS: ${{ inputs.versions }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          case "$REPEAT" in ''|*[!0-9]*|0) echo "::error title=bench::repeat is not a number of runs: $REPEAT"; exit 1 ;; esac
          list=""
          for v in $VERSIONS; do
            case "$v" in
              [0-9].[0-9]|[0-9].[0-9][0-9]) list="$list${list:+,}\"$v\"" ;;
              *) echo "::error title=bench::not a PHP version: $v"; exit 1 ;;
            esac
          done
          [ -n "$list" ] || { echo "::error title=bench::no versions given"; exit 1; }
          echo "list=[$list]" >> "$GITHUB_OUTPUT"

  bench:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.list) }}
    name: bench ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v5

      - name: bench.sh of azsupport/azsupport, into tools/
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
        run: |
          [ -n "$RUNS_TOKEN" ] || { echo "::error title=bench::no RUNS_TOKEN: no bench.sh"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $RUNS_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o tools/bench.sh "https://api.github.com/repos/azsupport/azsupport/contents/tests/php-src/bench.sh?ref=main"
          sh -n tools/bench.sh
          echo "tools/bench.sh: $(wc -l < tools/bench.sh) lines"

      - name: The newest release tarball of ${{ matrix.version }}, SHA-256 checked
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: sh tools/bench.sh --fetch "$VERSION" dist

      - name: Free space on the runner (the disk of the VM grows on it)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker system prune --all --force > /dev/null 2>&1 || true
          df -h /

      # the output of bench.sh into bench-results/<version>/bench.log, not into this log
      - name: Build, test and benchmark in FreeBSD 15.1
        id: bench
        uses: vmactions/freebsd-vm@v1
        env:
          BENCH_VERSION: ${{ matrix.version }}
          BENCH_REPEAT: ${{ inputs.repeat }}
          BENCH_VARIANTS: ${{ inputs.variants }}
          BENCH_TESTS: ${{ inputs.tests && '1' || '0' }}
          BENCH_EMBED: ${{ inputs.embed && '1' || '0' }}
        with:
          release: '15.1'
          envs: 'BENCH_VERSION BENCH_REPEAT BENCH_VARIANTS BENCH_TESTS BENCH_EMBED'
          prepare: |
            mkdir -p bench-results
            sh tools/bench.sh --deps > bench-results/deps.log 2>&1 || true
          run: |
            mkdir -p "bench-results/$BENCH_VERSION"
            sh tools/bench.sh -r "$BENCH_REPEAT" "$BENCH_VERSION" dist/php-"$BENCH_VERSION".*-fbsd-*.tar.xz > bench.log 2>&1 || true
            mv bench.log "bench-results/$BENCH_VERSION/bench.log"
            cat bench-results/deps.log >> "bench-results/$BENCH_VERSION/bench.log" 2>/dev/null || true
            # the build trees not back to the runner
            rm -rf bench-work

      - name: The report
        id: report
        if: always()
        env:
          VERSION: ${{ matrix.version }}
        run: |
          r="bench-results/$VERSION"
          if [ ! -s "$r/report.md" ]; then
            echo "::error title=bench $VERSION::no report"
            { printf '### PHP %s\n\nno report; the last lines of bench.sh:\n\n```text\n' "$VERSION"
              tail -n 40 "$r/bench.log" 2>/dev/null; printf '```\n'; } > report.md
            echo "test bench $VERSION: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp "$r/report.md" report.md
          { printf '\n<details><summary>bench.sh</summary>\n\n```text\n'; cat "$r/bench.log"; printf '```\n\n</details>\n'; } >> report.md
          echo "test bench $VERSION: OK" | tee -a "$GITHUB_STEP_SUMMARY"

      # the report into the branch runs of the private azsupport/azsupport (secret RUNS_TOKEN)
      - name: Report to azsupport/azsupport
        if: always()
        continue-on-error: true
        env:
          RUNS_TOKEN: ${{ secrets.RUNS_TOKEN }}
          RUNS_INPUTS: versions=${{ inputs.versions }} variants=${{ inputs.variants }} repeat=${{ inputs.repeat }} tests=${{ inputs.tests }} embed=${{ inputs.embed }}
          RUNS_STEPS: bench=${{ steps.bench.outcome }} report=${{ steps.report.outcome }}
          PART: php${{ matrix.version }}
        run: sh tools/runs-report.sh report.md "$PART"
