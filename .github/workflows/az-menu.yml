name: az-menu.sh release

# Publishes tools/az-menu.sh with its version as the file of the release az-menu
# (https://github.com/azsupport/php-src/releases/download/az-menu/az-menu.sh): the
# lines AZ_MENU_REV (the revision: the number of commits that changed it,
# php-menu.sh before it), AZ_MENU_COMMIT (the last of them) and AZ_MENU_DATE (its
# date) filled in, so that the top line of every screen of the menu and
# "sh az-menu.sh --version" show which version it is. tools/config-check.sh of the
# commit of the run goes with it (az-menu.sh fetches it from there). Runs when one
# of the two changes on master; started by hand: Actions, "az-menu.sh release",
# "Run workflow".

on:
  push:
    branches: [master]
    paths:
      - 'tools/az-menu.sh'
      - 'tools/config-check.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: az-menu
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: The copy with its version, and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=tools/az-menu.sh
          rev="r$(git log --follow --format=%H -- "$f" | wc -l | tr -d ' ')"
          commit="$(git log -1 --format=%h -- "$f")"
          full="$(git log -1 --format=%H -- "$f")"
          date="$(TZ=UTC git log -1 --date=format-local:'%d.%m.%Y %H:%M UTC' --format=%cd -- "$f")"
          mkdir -p out
          sed -e "s|^AZ_MENU_REV=\"\"\$|AZ_MENU_REV=\"$rev\"|" \
              -e "s|^AZ_MENU_COMMIT=\"\"\$|AZ_MENU_COMMIT=\"$commit\"|" \
              -e "s|^AZ_MENU_DATE=\"\"\$|AZ_MENU_DATE=\"$date\"|" "$f" > out/az-menu.sh
          grep -qx "AZ_MENU_REV=\"$rev\"" out/az-menu.sh && grep -qx "AZ_MENU_COMMIT=\"$commit\"" out/az-menu.sh &&
            grep -qx "AZ_MENU_DATE=\"$date\"" out/az-menu.sh || { echo "the version lines of $f were not filled in"; exit 1; }
          sh -n out/az-menu.sh
          cp tools/config-check.sh out/config-check.sh
          (cd out && sha256sum az-menu.sh config-check.sh > SHA256SUMS)
          cd out && sh ./az-menu.sh --version && cd ..
          notes="az-menu.sh $rev (commit $commit of $date): the copy with its version of tools/az-menu.sh of https://github.com/azsupport/php-src (the packages of the repository az, and PHP built as a package with the options chosen in dialogs), with tools/config-check.sh of commit ${GITHUB_SHA:0:9}. On a server: fetch https://github.com/$GITHUB_REPOSITORY/releases/download/az-menu/az-menu.sh, then sh az-menu.sh. The commit: https://github.com/$GITHUB_REPOSITORY/commit/$full"
          git tag -f az-menu "$full"
          git push -f origin refs/tags/az-menu
          if ! gh release view az-menu --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create az-menu --repo "$GITHUB_REPOSITORY" --title "az-menu.sh" --notes "$notes" --verify-tag --latest=false
          fi
          gh release edit az-menu --repo "$GITHUB_REPOSITORY" --title "az-menu.sh $rev" --notes "$notes" --latest=false
          gh release upload az-menu --repo "$GITHUB_REPOSITORY" --clobber out/az-menu.sh out/config-check.sh out/SHA256SUMS
