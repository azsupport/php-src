# FFmpeg for the video sites (tools/build-ffmpeg.sh, workflow ffmpeg.yml):
# ffmpeg and ffprobe in /usr/local/ffmpeg/bin, built from the FreeBSD ports
# with only what the sites (KVS) need. A file a user uploads meets no more code
# than that: FFmpeg finds the format of a file by its content, not by its name,
# so every demuxer that is built is one an upload can reach (a playlist named
# video.mp4 goes to the HLS demuxer, which reads what it lists).
#
# Built here: the containers and codecs the sites take (mp4, m4v, mov, mkv, webm;
# H.264, HEVC, AV1, VP9, VP8; AAC, MP3, Opus, Vorbis, AC3, E-AC3; JPEG, PNG and
# WebP pictures), what they write (H.264 with libx264 and AAC in mp4, screenshots
# in JPEG, PNG and WebP; mov and matroska for the joins of remote_cron.php with
# -f $source_format_type), the filters, local files and pipes. For remote_cron.php
# and the plugins of KVS also: the concat demuxer (joins with -f concat; only
# with -f concat, freebsd/ffmpeg/concat-no-probe.patch: an upload that is a concat
# script is not taken for one; it turns H.264 into Annex B on the way, hence the
# bitstream filter h264_mp4toannexb), image2 (movie_from_image: task-%d.jpg; it
# goes by the name of the file only) and the lavfi device (-f lavfi -i anullsrc:
# silence for a video without sound; a device is used only with -f; its sound
# comes as PCM and its pictures as wrapped frames, hence the decoders pcm_u8,
# pcm_s16le, pcm_s32le, pcm_f32le, pcm_f64le and wrapped_avframe - plain copies,
# and no file maps to wrapped_avframe). The webp muxer writes .webp screenshots
# (image2 does not take that extension). No network, no
# playlists, no subtitles (a conversion to mp4 leaves them out when there is no
# encoder for them; -c copy keeps them), nothing found on the build host by
# itself (--disable-autodetect).
#
#   ports <commit>        the freebsd-ports commit: the versions, distfiles and
#                         checksums (distinfo) and patches of the ports below
#   lib <name> <port>     a library linked in statically, in build order; the
#                         last line, ffmpeg, is FFmpeg itself (with the port's
#                         patches, then those of freebsd/ffmpeg/)
#   take, upstream        as in freebsd/deps.conf: a new upstream release taken
#                         before its port (only for a vulnerability that touches
#                         us, or a bug we have); where tools/upstream-check.py looks for
#                         new releases (x264 has none: the port follows its stable
#                         branch)
#   configure <option>... options of FFmpeg's configure, in this order, after
#                         those of the script (--prefix, the compiler, the flags);
#                         --disable-everything turns off every component, the
#                         lines after it turn on the ones the sites need

ports 0c418eb55443194a668dc10641d979bf8bc05647

lib x264          multimedia/libx264
lib dav1d         multimedia/dav1d
lib webp          graphics/webp
lib ffmpeg        multimedia/ffmpeg

upstream ffmpeg   9.0.2     https://github.com/FFmpeg/FFmpeg                   n(\d+\.\d+(?:\.\d+)?)
upstream dav1d    1.5.4     https://github.com/videolan/dav1d                  (\d+\.\d+\.\d+)
upstream webp     1.6.0     https://chromium.googlesource.com/webm/libwebp     v(\d+\.\d+\.\d+)

configure --enable-gpl
configure --enable-static --disable-shared
configure --enable-pic --extra-ldexeflags=-pie --extra-ldflags=-Wl,-z,relro,-z,now
configure --enable-lto
configure --disable-autodetect --enable-pthreads --enable-zlib --disable-iconv
configure --disable-network
configure --disable-doc --disable-ffplay
configure --disable-everything
configure --enable-libx264 --enable-libdav1d --enable-libwebp
configure --enable-protocol=file,pipe
configure --enable-demuxer=mov,matroska,concat,image2,image_jpeg_pipe,image_png_pipe,image_webp_pipe
configure --enable-indev=lavfi
configure --enable-parser=h264,hevc,av1,vp9,vp8,aac,mpegaudio,opus,vorbis,ac3,mjpeg,png,webp
configure --enable-decoder=h264,hevc,libdav1d,vp9,vp8,aac,mp3float,opus,vorbis,ac3,eac3,mjpeg,png,webp
configure --enable-decoder=pcm_u8,pcm_s16le,pcm_s32le,pcm_f32le,pcm_f64le,wrapped_avframe
configure --enable-bsf=h264_mp4toannexb
configure --enable-encoder=libx264,aac,mjpeg,png,libwebp
configure --enable-muxer=mp4,mov,matroska,image2,mjpeg,webp,null
configure --enable-filters
