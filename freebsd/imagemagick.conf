# ImageMagick 6 and 7 for the video sites (tools/build-imagemagick.sh;
# tools/build-az.sh and the workflow az.yml build all of /usr/local/az): their
# programs side by side in /usr/local/az/bin, ImageMagick 7 as magick with the
# usual names linked to it (convert, identify, mogrify, composite...),
# ImageMagick 6 with a 6 at the end of every name (convert6, identify6, mogrify6,
# composite6...; the FreeBSD packages ImageMagick6 and ImageMagick7 conflict).
# Their own files have names of their own: etc/ImageMagick-6 and -7 (the
# configuration, with the policy), share/ImageMagick-6 and -7, lib/ImageMagick-6.*
# and -7.*. Static: the libraries are those of /usr/local/az (freebsd/deps.conf,
# with its ports commit), the programs need none of /usr/local/lib; the fonts and
# the configuration of fontconfig are those of the system (/usr/local/etc/fonts).
# ImageMagick 7 also leaves its static libraries, headers and .pc files in
# /usr/local/az (lib/libMagickCore-7.a, include/ImageMagick-7, and
# bin/MagickWand-config with the static link line): imagick of PHP links them in
# (--with-imagick=/usr/local/az), with the same formats and policy. Those of
# ImageMagick 6 are not kept: nothing links against it.
#
# Only what the sites need, from the FreeBSD ports, with the options of the ports
# narrowed down: JPEG (mozjpeg, as JPEG_PORT of the servers), PNG, WebP, GIF and
# BMP (built into ImageMagick; BMP is the intermediate file of the sites'
# screenshots), HEIC and AVIF (libheif with the decoders libde265 and dav1d, no
# encoders), text (FreeType, fontconfig), colour profiles (lcms2). No
# SVG, PDF, PostScript (no Ghostscript), RAW, EXR, JPEG 2000, JPEG XL, DjVu, WMF,
# TIFF, FlashPIX, X11, Perl, OpenMP, loadable modules, libxml2 (MSL, URL). The
# policy freebsd/imagemagick/policy.xml (installed as etc/ImageMagick-<6|7>/
# policy.xml) allows only those formats, BMP, and a few built-in ones (xc:,
# label:, caption:), no delegate programs, no @file indirection, no reading of /etc.
#
#   im <name> <port>      an ImageMagick built against the libraries of
#                         /usr/local/az, at the ports commit of freebsd/deps.conf
#   take, upstream        as in freebsd/deps.conf (take: a new upstream release
#                         before its port, only for a vulnerability that touches
#                         us, or a bug we have; the upstream lines of the
#                         libraries are in deps.conf)
#   configure <option>... options of the configure of both ImageMagicks, after
#                         --prefix and the flags of the script; configure6 and
#                         configure7 only for one of them

im imagemagick6   graphics/ImageMagick6
im imagemagick7   graphics/ImageMagick7

upstream imagemagick6  6.9.13-60  https://github.com/ImageMagick/ImageMagick6  (\d+\.\d+\.\d+-\d+)
upstream imagemagick7  7.1.2-35   https://github.com/ImageMagick/ImageMagick   (\d+\.\d+\.\d+-\d+)

# Taken on 08.11.2026 before their ports, for GHSA fixes in what we build:
# coders/png.c (GHSA-m2p5-qpx9-5mx6), the pixel cache (GHSA-5jwm-r7f4-4m53,
# GHSA-q66g-3m63-78mh), MagickCore/image.c (GHSA-c764-55gw-gj6c), a limit to the
# profiles of an image and GIF. The ports have no patches. The SHA-256 is that of
# the release file of GitHub; the addresses are the port's mirrors (MASTER_SITES),
# so the build checks the file of a mirror against it (two sources).
take imagemagick6  6.9.13-60  https://download.imagemagick.org/archive/releases/ImageMagick-6.9.13-60.tar.xz,https://ftp.acc.umu.se/mirror/imagemagick.org/ftp/releases/ImageMagick-6.9.13-60.tar.xz,https://mirror.dogado.de/imagemagick/releases/ImageMagick-6.9.13-60.tar.xz  2a1367ecd77c73660c1c0e62660ff3c3c89f1ca686595de2d71be4229ad504ba  ImageMagick-6.9.13-60
take imagemagick7  7.1.2-35   https://download.imagemagick.org/archive/releases/ImageMagick-7.1.2-35.tar.xz,https://ftp.acc.umu.se/mirror/imagemagick.org/ftp/releases/ImageMagick-7.1.2-35.tar.xz,https://mirror.dogado.de/imagemagick/releases/ImageMagick-7.1.2-35.tar.xz  9554556c8cbf7d347cbd6bedae931ccf323a2bd5e0f08d4834856568ee19f080  ImageMagick-7.1.2-35

configure --disable-shared --enable-static --without-modules
configure --with-quantum-depth=16 --with-threads --disable-openmp --without-gcc-arch
configure --with-jpeg --with-png --with-webp --with-heic --with-freetype --with-fontconfig --with-lcms --with-zlib
configure --without-bzlib --without-lzma --without-zstd --without-xml --without-tiff --without-openjp2 --without-openexr
configure --without-raw --without-rsvg --without-pango --without-raqm --without-wmf --without-djvu --without-fpx
configure --without-jbig --without-fftw --without-lqr --without-gslib --without-gvc --without-flif --without-dps
configure --without-perl --without-x --without-magick-plus-plus --disable-docs --disable-deprecated
configure6 --disable-hdri --program-suffix=6
configure7 --enable-hdri --without-jxl --without-uhdr --without-zip --without-dmr
