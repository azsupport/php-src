# ImageMagick 6 and 7 for the video sites (tools/build-imagemagick.sh, workflow
# imagemagick.yml): their programs (IM6: convert, identify, mogrify, composite...;
# IM7: magick with the same names linked to it) in /usr/local/imagemagick6/bin
# and /usr/local/imagemagick7/bin, so that both can be installed at once (the
# FreeBSD packages ImageMagick6 and ImageMagick7 conflict). Static: the libraries
# below are linked in, the programs need none of /usr/local/lib; the fonts and
# the configuration of fontconfig are those of the system (/usr/local/etc/fonts).
#
# Only what the sites need, from the FreeBSD ports, with the options of the ports
# narrowed down: JPEG (mozjpeg, as JPEG_PORT of the servers), PNG, WebP, GIF
# (built into ImageMagick), HEIC and AVIF (libheif with the decoders libde265 and
# dav1d, no encoders), text (FreeType, fontconfig), colour profiles (lcms2). No
# SVG, PDF, PostScript (no Ghostscript), RAW, EXR, JPEG 2000, JPEG XL, DjVu, WMF,
# TIFF, FlashPIX, X11, Perl, OpenMP, loadable modules, libxml2 (MSL, URL). The
# policy freebsd/imagemagick/policy.xml (installed as etc/ImageMagick-<6|7>/
# policy.xml) allows only those formats and a few built-in ones (xc:, label:,
# caption:), no delegate programs, no @file indirection, no reading of /etc.
#
#   ports <commit>        the freebsd-ports commit: the versions, distfiles and
#                         checksums (distinfo) and patches of the ports below
#   lib <name> <port>     a library linked in statically, in build order
#   im <name> <port> <prefix>
#                         an ImageMagick built against them, into <prefix>
#   take, upstream        as in freebsd/deps.conf (take: a new upstream release
#                         before its port, only for a vulnerability that touches
#                         us, or a bug we have)
#   configure <option>... options of the configure of both ImageMagicks, after
#                         --prefix and the flags of the script; configure6 and
#                         configure7 only for one of them

ports 0c418eb55443194a668dc10641d979bf8bc05647

lib png           graphics/png
lib mozjpeg       graphics/mozjpeg
lib webp          graphics/webp
lib freetype2     print/freetype2
lib expat         textproc/expat2
lib fontconfig    x11-fonts/fontconfig
lib lcms2         graphics/lcms2
lib libde265      multimedia/libde265
lib dav1d         multimedia/dav1d
lib libheif       graphics/libheif

im imagemagick6   graphics/ImageMagick6   /usr/local/imagemagick6
im imagemagick7   graphics/ImageMagick7   /usr/local/imagemagick7

upstream imagemagick6  6.9.13-50  https://github.com/ImageMagick/ImageMagick6  (\d+\.\d+\.\d+-\d+)
upstream imagemagick7  7.1.2-25   https://github.com/ImageMagick/ImageMagick   (\d+\.\d+\.\d+-\d+)
upstream libheif       1.23.6     https://github.com/strukturag/libheif        v(\d+\.\d+\.\d+)
upstream libde265      1.1.1      https://github.com/strukturag/libde265       v(\d+\.\d+\.\d+)
upstream lcms2         2.19.1     https://github.com/mm2/Little-CMS            lcms(\d+\.\d+(?:\.\d+)?)
upstream fontconfig    2.18.3     https://gitlab.freedesktop.org/fontconfig/fontconfig.git  (\d+\.\d+\.\d+)
upstream expat         2.9.0      https://github.com/libexpat/libexpat         R_(\d+_\d+_\d+)

configure --disable-shared --enable-static --without-modules
configure --with-quantum-depth=16 --with-threads --disable-openmp --without-gcc-arch
configure --with-jpeg --with-png --with-webp --with-heic --with-freetype --with-fontconfig --with-lcms --with-zlib
configure --without-bzlib --without-lzma --without-zstd --without-xml --without-tiff --without-openjp2 --without-openexr
configure --without-raw --without-rsvg --without-pango --without-raqm --without-wmf --without-djvu --without-fpx
configure --without-jbig --without-fftw --without-lqr --without-gslib --without-gvc --without-flif --without-dps
configure --without-perl --without-x --without-magick-plus-plus --disable-docs --disable-deprecated
configure6 --disable-hdri
configure7 --enable-hdri --without-jxl --without-uhdr --without-zip --without-dmr
