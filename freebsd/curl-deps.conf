# The libraries of the bundled curl ("configure --with-curl=bundled"), so that it
# needs no package: tools/curl-sources.sh unpacks each release file into
# ext/curl/deps/<name> of every target with a curl in freebsd/curl.conf (and into
# the work tree of tools/build-deps.sh, so that /usr/local/phpdeps has the same
# ones), applies freebsd/curl/<name>-<version>.patch when there is one, and
# ext/curl/build-libcurl.sh builds them, static and position independent, before
# curl. The release files are the ones of freebsd-ports (distinfo of the port);
# the port is followed by tools/upstream-check.py (freebsd/upstream.conf), the
# releases by the tags of the repository ("-": no releases, the port is followed).
#
# Not here, on purpose: libunistring (libidn2 builds the part of it that it needs,
# --with-included-libunistring) and an IDN library for libpsl (curl hands it the
# names in punycode already, so the built-in list is enough).
