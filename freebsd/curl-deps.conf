# The libraries of the bundled curl ("configure --with-curl=bundled"), so that it
# needs no package: tools/curl-sources.sh unpacks each release file into
# ext/curl/deps/<name> of every target with a curl in freebsd/curl.conf (the copy
# of this file in azsupport/ports, az/az/files/curl-deps.conf, gives the package az
# the same ones), applies freebsd/curl/<name>-<version>.patch when there is one, and
# ext/curl/build-libcurl.sh builds them, static and position independent, before
# curl. The release files are those of the FreeBSD ports, with the SHA-256 of their
# distinfo: a new release is taken when its port has it; before the port only when
# it fixes a vulnerability that touches us, or a bug we have (then the upstream
# release file, its SHA-256 checked against a second source; once the port has the
# version, its distinfo has to list the same file). tools/upstream-check.py follows
# the tags of the repositories ("-": no releases, the port is followed) and the
# ports (freebsd/upstream.conf).
#
# Not here, on purpose: libunistring (libidn2 builds the part of it that it needs,
# --with-included-libunistring) and an IDN library for libpsl (curl hands it the
# names in punycode already, so the built-in list is enough).
#
