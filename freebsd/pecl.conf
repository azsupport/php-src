# PECL extensions bundled into ext/<name> of the freebsd/<target> branches by
# tools/sync.sh (commit "Bundle PECL extensions"), so that they are built into PHP
# like the bundled extensions. Nothing changes unless they are enabled:
#   redis      --enable-redis
#   memcached  --enable-memcached --with-libmemcached-dir=/usr/local --disable-memcached-sasl
#   memcache   --enable-memcache
#   imagick    --with-imagick=/usr/local (ImageMagick 6 or 7; not together with gmagick)
#   igbinary   --enable-igbinary; for redis and memcached also --enable-redis-igbinary,
#              --enable-memcached-igbinary (their igbinary serializer)
#   swoole     --enable-swoole (7.4 and newer)
#   openswoole --enable-openswoole (7.4 and newer; not together with swoole): 4.12.1
#              everywhere, the OpenSwoole 4.x API the servers run (22 and newer changed
#              it); for 8.3 and 8.4, which 4.12 does not support upstream, ported
#              in freebsd/pecl/openswoole-4.12.1.patch
#   excimer    --enable-excimer (7.4 and newer)
#   gmagick    --with-gmagick=/usr/local (package GraphicsMagick; not together with
#              imagick); no stable release: 2.0.6RC1 plus the later PHP 8.1 fixes of
#              its git master, 1.1.7RC3 for 5.6
#   mcrypt     --with-mcrypt=/usr/local (7.4 and newer, package libmcrypt; 5.6 has it)
# Versions: the newest stable PECL release that supports the PHP version
# (https://pecl.php.net/package/<name>); sources from the upstream git repositories
# at the commit of that release tag. A fix for the sources goes into
# freebsd/pecl/<name>-<version>.patch (-p1 inside the extension directory).
#
