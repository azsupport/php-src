# The PHP modules of the pkg mode (tools/build-pkg.sh): each one built on its own
# against the installed core phpXY (phpizeXY, ./configure
# --with-php-config=php-configXY, make) and packaged as phpXY-<module>, with the
# package names and origins of the FreeBSD ports (Mk/Uses/php.mk of freebsd-ports
# main, 08.11.2026), so that the modules of every version install side by side:
# lib/php/<API>/<module>.so, etc/phpXY/conf.d/ext-<prio>-<module>.ini,
# include/phpXY/php/ext/<module>.
#
# One line per package, in build order: a module comes after the modules whose
# headers it includes (session before igbinary, memcache, memcached and redis;
# igbinary before memcached and redis; mysqlnd before mysqli, pdo_mysql, swoole
# and openswoole; pdo before pdo_mysql and pdo_sqlite; dom before xmlreader and
# xsl; sockets before swoole and openswoole), because build-pkg.sh installs each
# package before it builds the next one.
#
# Fields (separated by blanks; the configure options are the rest of the line):
#   versions  the PHP versions the line is for: shell patterns separated by
#             commas (7.4, 8.*). The options are those of that version: a
#             version whose options differ gets a line of its own. Only 7.4 is
#             worked out so far; 5.6 and 8.1-8.4 get their lines when they are.
#   module    the directory in ext/ of the source and the name of the .so
#   source    php: a bundled extension, the version of the package is that of
#             PHP; pecl: a PECL extension bundled by tools/sync.sh, the version
#             is the one of freebsd/pecl.conf
#   package   the package name; @V@ is the version without the dot (74)
#   origin    the origin of the port (php.mk: <module>_DEPENDS), the PECL ones as
#             <category>/php-<module> (below); one without a port gets one so too
#   prio      the priority in the name of the ini (ext-<prio>-<module>.ini), as
#             the ports: 20 for a module that needs no other module, 30 for one
#             that does, the own one of a port where it has one (opcache 10,
#             "needed by Zend extensions, keep before everything", session 18:
#             PHP_MOD_PRIO of lang/php74/Makefile.ext). PHP loads the .ini files of
#             conf.d in the order of their names, and the run-time linker resolves
#             the data symbols of a module when PHP loads it, so a module that
#             others need must load first; build-pkg.sh checks that every module
#             a line needs has a lower priority, or the same one and a name that
#             sorts first.
#   needs     the modules it needs at build and at run time, separated by commas
#             (their packages become dependencies), pkg:<name> for a package that
#             is not a module (ImageMagick7), - for none. php@V@ of the same
#             build is a dependency of every module, az of every module
#             whose .so links a library of /usr/local/az/lib (readelf -d).
#   license   the licence of the port (PHP301 for the bundled extensions)
#   ini       on: the ini loads the module (extension=<module>.so); zend: it loads
#             a Zend extension (zend_extension=<module>.so: opcache); off:<module>:
#             the line of the ini is commented out, because PHP stops when this
#             module and <module> are loaded together, and the package says so in
#             its message
#   options   the options of ./configure, - for none; @AZ@ is /usr/local/az
#
# Libraries: the shared libraries of the package az (/usr/local/az/lib,
# found by pkg-config of /usr/local/az/bin/pkg-config, run path
# /usr/local/az/lib) or those of the base system of FreeBSD 15: OpenSSL,
# zlib and bzip2 (--with-bz2=/usr, --with-zlib-dir=/usr, --with-openssl-dir=/usr).
# No library of the ports (/usr/local/lib): build-pkg.sh fails a module that links one.
#
# Databases: the MySQL modules use mysqlnd wherever they can (aZ, 08.11.2026: «для
# зависимостей от баз юзай по умолчанию для модулей mysqlnd везде где можно чтобы было
# минимальные зависимости»), never libmysqlclient (a port): mysqli
# --with-mysqli=mysqlnd, pdo_mysql --with-pdo-mysql=mysqlnd, and for 5.6 later mysql
# --with-mysql=mysqlnd. mysqlnd is a module of its own (aZ, 08.11.2026), the package
# php@V@-mysqlnd with the origin databases/php@V@-mysqlnd (the port lang/phpXY builds
# mysqlnd in, so there is no port of it), its compression on the zlib of the base
# system; mysqli, pdo_mysql, and swoole and openswoole with their mysqlnd support
# need it.
#
# openssl comes in two kinds, one of the two per version: php@V@-openssl, and
# php@V@-openssl-legacy with --with-openssl-legacy-provider of the fork (RC4,
# Blowfish, DES, CAST5, MD4 of the legacy provider of OpenSSL; aZ's sites need RC4).
# Both install the same openssl.so and ini, so pkg sees the file conflict and takes
# one in the place of the other. The legacy kind has no port: its origin is that of
# the standard kind with -legacy.
#
# swoole and openswoole both install, but OpenSwoole is a fork of Swoole with the
# same classes, and PHP stops when both are loaded: the ini of openswoole comes
# with its line commented out.
#
# No "pecl" in the names (aZ, 08.11.2026: «pecl везде удали, только будет путать меня
# лишний раз»): the PECL extensions are packages phpXY-<module> too, with the origins
# <category>/php-<module>, the scheme the ports took when they moved redis and swoole
# off PECL (freebsd-ports MOVED: databases/pecl-redis -> databases/php-redis
# 21.10.2026, devel/pecl-swoole -> devel/php-swoole 12.07.2026): converters/php-igbinary,
# databases/php-memcache, databases/php-memcached, databases/php-redis,
# graphics/php-imagick, security/php-mcrypt, devel/php-excimer, devel/php-swoole,
# devel/php-openswoole. The field "source" still says where the version comes from.
#
# The base of the list for 7.4 is the ports at the commit of 7.4 in
# freebsd/targets.conf (036685c034ba; aZ, 08.11.2026: «у тебя же уже скачанные порты
# есть все для всех версий, там же их за базу возьми»): the options of
# lang/php74-extensions (OPTIONS_DEFINE: BCMATH BZ2 CALENDAR CTYPE CURL DBA DOM ENCHANT
# EXIF FILEINFO FILTER FTP GD GETTEXT GMP ICONV INTL IMAP JSON LDAP MBSTRING MYSQLI
# ODBC OPCACHE OPENSSL PCNTL PDF PDO PDO_DBLIB PDO_FIREBIRD PDO_MYSQL PDO_ODBC
# PDO_PGSQL PDO_SQLITE PGSQL PHAR POSIX PSPELL READLINE SESSION SHMOP SIMPLEXML SNMP
# SOAP SOCKETS SODIUM SQLITE3 SYSVMSG SYSVSEM SYSVSHM TIDY TOKENIZER XML XMLREADER
# XMLRPC XMLWRITER XSL ZIP ZLIB), devel/php74-ffi and the PECL ports of that commit
# (pecl-igbinary, -memcache, -memcached, -redis, -imagick, -mcrypt, -swoole). Not
# built of them: enchant, imap, ldap, odbc, pdf (PDFlib), pdo_dblib, pdo_firebird,
# pdo_odbc, pdo_pgsql, pgsql, pspell, snmp (they need a library of the ports: an open
# question). Here and not in those ports: mysqlnd (an
# option of lang/php74 there, a package of its own by aZ's decision), openssl-legacy
# (aZ's decision), openswoole (no port), excimer (its port devel/pecl-excimer came
# later).
#
# The rule for every version (aZ, 08.11.2026): the base is the ports of the own
# commit of that version in freebsd/targets.conf (5.6 d2c06ef5efae, 7.4
# 036685c034ba, 8.1 6002588334a9, 8.2 438e512499a9, 8.3 eb0100f974b6, 8.4
# 1a235373d266); a module that is not in them is taken from the ports of the
# nearest higher version that has it (excimer), or written here (openswoole,
# mysqlnd, openssl-legacy). The other versions get their lines so when they are
# worked out.
#
# Not built: the modules that need a port (pgsql, pdo_pgsql, ldap, odbc, pdo_odbc,
# pdo_dblib, snmp, imap, enchant, pspell, pdo_firebird, gmagick; the dba handlers
# db4, gdbm, lmdb, qdbm, tcadb), and oci8, pdo_oci, com_dotnet, zend_test, skeleton.
# In the core, not packages: Core, date, hash, pcre (the bundled PCRE2), Reflection,
# SPL, standard (argon2 of az), libxml (libxml2 of az). json (5.6,
# 7.4; always in the core from 8.0) and OPcache are modules (aZ, 08.11.2026: «давай
# в модули раз скорости не дают»; built into the static packages): php@V@-json and
# php@V@-opcache, a Zend extension, as the ports. No module here needs json with
# these options: redis, memcached and swoole only with --enable-redis-json,
# --enable-memcached-json and --enable-swoole-json.
#
# Options: the features of the preset of tools/build-test.sh (those of the static
# packages), in the form the config.m4 of each extension takes them on its own.
#
