# PCRE built into PHP instead of the copy upstream bundles: tools/sync.sh unpacks
# the release tarball, runs freebsd/pcre/import-pcre2.sh (5.6: import-pcre1.sh) on
# the tree - ext/pcre/pcre2lib (5.6: ext/pcre/pcrelib) becomes that release, with
# PHP's own config.h, and main/php_compat.h renames every function of it to
# php_pcre* - and applies freebsd/pcre/tests-<target>.patch: the ext/pcre tests that
# print messages of the library expect both the old and the new wording, as php-src
# has them since 8.1 and 8.3. --with-external-pcre (5.6: --with-pcre-regex=DIR)
# still takes the library of the system.
#
# Upstream bundles: 5.6 PCRE 8.38, 7.4 PCRE2 10.35, 8.1 10.39, 8.2 10.40, 8.3 10.42,
# 8.4 10.44 - with the JIT bugs fixed in 10.40 (CVE-2022-1586, CVE-2022-1587), the
# security fixes of 10.48 (CVE-2026-89156 and others) and of 10.49 (CVE-2026-103111,
# JIT); see README.md, "Bundled PCRE". PCRE 8.45 (2021) is the last PCRE1 release;
# PCRE2 releases are followed by tools/upstream-check.py.
