# curl built into PHP with "configure --with-curl=bundled". tools/sync.sh unpacks
# the release tarball into ext/curl/libcurl of freebsd/<target>, applies
# freebsd/curl/curl-<version>.patch (from freebsd-ports ftp/curl), copies
# freebsd/curl/build-libcurl.sh to ext/curl/ and puts freebsd/curl/config-hook.m4
# into ext/curl/config.m4. curl 8.18.0 and later need OpenSSL 3.0 or later, so
# FreeBSD 13.x (OpenSSL 1.1.1 in base) keeps the libcurl of pkg (--with-curl).
