# What tools/upstream-check.py (workflow upstream-check.yml) follows besides
# freebsd/pecl.conf (releases of the bundled extensions), freebsd/curl.conf
# (releases of the bundled curl) and freebsd/targets.conf (lang/<port> from its
# portrev on).
#
#   pin   <extension> <series>     report only the releases of this series
#   port  <ports dir> <revision>   a FreeBSD port to follow: <revision> is the
#                                  freebsd-ports commit up to which its patches and
#                                  options were reviewed. Later commits that change
#                                  files/ or the Makefile beyond the version lines
#                                  open an issue; after the review, move <revision>.
#                                  A 4th column: the port of azsupport/ports that
#                                  builds it.
#   gentoo <dir> <date> <port>     a directory of gentoo/gentoo whose patches <port>
#                                  of azsupport/ports takes: its commits after <date>
#                                  open an issue; after the review, move <date>.
#   cve   <word> <date> <port>     the CVEs of NVD whose text names <word>, published
#                                  after <date>: an issue when there are new ones
#                                  (a library without upstream, <port> of
#                                  azsupport/ports); after the review, move <date>.
#
# A new release of curl, of its libraries, of PCRE2 and of the libraries of az,
# FFmpeg and ImageMagick (their conf files in azsupport/ports) is taken when its
# FreeBSD port has it;
# before the port only when it fixes a vulnerability that touches us, or a bug we
# have (rule of 04.11.2026; the release issues name the CVE and GHSA ids of the
# release notes). The ports are followed for their build patches and what FreeBSD
# needs. A new release of a bundled extension is taken when it is out.

pin   openswoole  4.12                          # stay on 4.12 (ported to 8.3 and 8.4 here), no 22.x and later

port  databases/php-redis       f3611d920828    # databases/pecl-redis until 21.10.2026
port  databases/pecl-memcached  f3611d920828
port  databases/pecl-memcache   f3611d920828
port  graphics/pecl-imagick     f3611d920828
port  converters/pecl-igbinary  f3611d920828
port  devel/php-swoole          1031e9468419    # devel/pecl-swoole until 12.07.2026
port  devel/pecl-excimer        f3611d920828
port  security/pecl-mcrypt      f3611d920828
port  security/pecl-ssh2        f16b6dd0f7c1    # 1.3.1 there; ours newer (freebsd/pecl.conf)
port  ftp/curl                  f3611d920828    # the bundled curl (freebsd/curl.conf, freebsd/curl/)
# The libraries of the bundled curl (freebsd/curl-deps.conf); their distinfo is
# compared with the bundle too. Reviewed 23.10.2026: the patches of nghttp2
# (Makefile.in: build lib/ only) and brotli (CMakeLists.txt: library names) are
# about packaging, the one of libidn2 (config.h.in) removes a define its code
# does not use, zstd has cmake files and a manual page fix, c-ares and libpsl none.
port  dns/c-ares                85ad0319366a
port  www/libnghttp2            85ad0319366a
port  archivers/brotli          85ad0319366a
port  archivers/zstd            85ad0319366a
port  dns/libidn2               85ad0319366a
port  dns/libpsl                85ad0319366a
port  security/libssh2          f16b6dd0f7c1    # reviewed 10.11.2026: its PATCHFILES are freebsd/curl/libssh2-1.11.1.patch
port  dns/public_suffix_list    85ad0319366a    # the built-in list of libpsl
port  devel/pcre2               85ad0319366a    # the bundled PCRE2 (freebsd/pcre.conf)
# gmagick and openswoole have no FreeBSD port.

# t1lib: devel/t1lib of azsupport/ports, libt1 of php56-gd-t1lib (aZ, 11.11.2026).
# Its upstream is gone since 2007 (5.1.2): the official port as it is, with the
# fixes of its vulnerabilities that the official port lacks, taken from Gentoo
# (media-libs/t1lib 5.1.2-r5, files/): FreeBSD may take them too (its port), Gentoo
# new ones, and new CVEs may come.
port  devel/t1lib               6e4a386577aa  devel/t1lib   # the official tree of azsupport/ports (tools/build.sh)
gentoo media-libs/t1lib         2026-11-11    devel/t1lib
cve   t1lib                     2026-11-11    devel/t1lib
