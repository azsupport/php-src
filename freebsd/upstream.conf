# What tools/upstream-check.py (workflow upstream-check.yml) follows besides
# freebsd/pecl.conf (releases of the bundled extensions), freebsd/curl.conf
# (releases of the bundled curl) and freebsd/targets.conf (lang/<port> from its
# portrev on).
#
#   pin   <extension> <series>     report only the releases of this series
#   port  <ports dir> <revision>   a FreeBSD port to follow: <revision> is the
#                                  freebsd-ports commit up to which its patches and
#                                  options were reviewed. Later commits that change
#                                  files/ or the Makefile beyond the version lines
#                                  open an issue; after the review, move <revision>.
#                                  A 4th column: the port of azsupport/ports that
#                                  builds it.
#   gentoo <dir> <date> <ours>     a directory of gentoo/gentoo with patches for <ours>:
#                                  its commits after <date> open an issue; after the
#                                  review, move <date>.
#   cve   <word> <date> <port>     the CVEs of NVD whose text names <word>, published
#                                  after <date>: an issue when there are new ones
#                                  (a library without upstream, <port> of
#                                  azsupport/ports); after the review, move <date>.
#   openbsd <dir> <date> <ours>    as gentoo, for a directory of openbsd/ports (the
#                                  GitHub mirror of the CVS tree of OpenBSD).
#   debian <package> <date> <ours> [uploads]
#                                  a source package of Debian: its advisories (DSA,
#                                  DLA; ELA of Freexian's Extended LTS) after <date>
#                                  and, with "uploads", its uploads to unstable after
#                                  <date> (its changelog); after the review, move <date>.
#   sury  <package> <date> <ours>  the uploads of <package> to the PPA ondrej/php of
#                                  Ondrej Sury (deb.sury.org) after <date>, with their
#                                  changelog: the fixes he backports to old PHP.
#   ubuntu <package> <date> <ours> the same for Ubuntu (php8.1 of 22.04, php8.3 of 24.04).
#   github <owner>/<repo>@<branch> <commit> <ours>
#                                  the commits of a branch of an upstream on GitHub after
#                                  <commit>, the last one reviewed: the fixes of a port of
#                                  ours ahead of its FreeBSD port; after the review, move
#                                  <commit>.
#   default <variable> <value> <ours>
#                                  a default version of the ports tree, <variable> of
#                                  Mk/bsd.default-versions.mk of freebsd-ports main
#                                  (PYTHON_DEFAULT, PERL5_DEFAULT): an issue when it is no
#                                  longer <value>, the version of <ours>; after the switch
#                                  of ours (aZ's word), move <value>.
#
# <ours> (the last column) is what the row is for: a port of azsupport/ports, a library
# of az (az/az:<library> of its deps.conf) or a file or branch of this fork (freebsd/...).
#
# A new release of curl, of its libraries, of PCRE2 and of the libraries of az,
# FFmpeg and ImageMagick (their conf files in azsupport/ports) is taken when its
# FreeBSD port has it;
# before the port only when it fixes a vulnerability that touches us, or a bug we
# have (rule of 04.11.2026; the release issues name the CVE and GHSA ids of the
# release notes). The ports are followed for their build patches and what FreeBSD
# needs. A new release of a bundled extension is taken when it is out.

pin   openswoole  4.12                          # stay on 4.12 (ported to 8.3 and 8.4 here), no 22.x and later

port  databases/php-redis       f3611d920828    # databases/pecl-redis until 21.10.2026
port  databases/pecl-memcached  f3611d920828
port  databases/pecl-memcache   f3611d920828
port  graphics/pecl-imagick     f3611d920828
port  converters/pecl-igbinary  f3611d920828
port  devel/php-swoole          1031e9468419    # devel/pecl-swoole until 12.07.2026
port  devel/pecl-excimer        f3611d920828
port  security/pecl-mcrypt      f3611d920828
port  security/pecl-ssh2        f16b6dd0f7c1    # 1.3.1 there; ours newer (freebsd/pecl.conf)
port  ftp/curl                  f3611d920828    # the bundled curl (freebsd/curl.conf, freebsd/curl/)
# The libraries of the bundled curl (freebsd/curl-deps.conf); their distinfo is
# compared with the bundle too. Reviewed 23.10.2026: the patches of nghttp2
# (Makefile.in: build lib/ only) and brotli (CMakeLists.txt: library names) are
# about packaging, the one of libidn2 (config.h.in) removes a define its code
# does not use, zstd has cmake files and a manual page fix, c-ares and libpsl none.
port  dns/c-ares                85ad0319366a
port  www/libnghttp2            651d8141de5a    # 1.71.0 (12.11.2026): the version alone
port  archivers/brotli          85ad0319366a
port  archivers/zstd            85ad0319366a
port  dns/libidn2               85ad0319366a
port  dns/libpsl                85ad0319366a
port  security/libssh2          f16b6dd0f7c1    # reviewed 10.11.2026: its PATCHFILES are freebsd/curl/libssh2-1.11.1.patch
port  dns/public_suffix_list    85ad0319366a    # the built-in list of libpsl
port  devel/pcre2               85ad0319366a    # the bundled PCRE2 (freebsd/pcre.conf)
# gmagick and openswoole have no FreeBSD port.

# t1lib: devel/t1lib of azsupport/ports, libt1 of php56-gd-t1lib (aZ, 11.11.2026).
# Its upstream is gone since 2007 (5.1.2): the official port as it is, with the
# fixes of its vulnerabilities that the official port lacks, taken from Gentoo
# (media-libs/t1lib 5.1.2-r5, files/): FreeBSD may take them too (its port), Gentoo
# new ones, and new CVEs may come.
port  devel/t1lib               9a69436ea72f  devel/t1lib   # the official tree of azsupport/ports (tools/build.sh)
gentoo  media-libs/t1lib               2026-11-12  devel/t1lib
cve   t1lib                     2026-11-11    devel/t1lib

# 3proxy: net/3proxy of azsupport/ports, 0.9.9.3 of the LTS line of upstream ahead of
# the official port (0.9.5, unsupported), for its security fixes (aZ, 11.11.2026), with
# the fixes of the branch 0.9 after it (files/patch-src_pcre.c, patch-src_tlspr.c).
github 3proxy/3proxy@0.9         5aa3886eb8b6  net/3proxy

# GCC 16 of the PHP builds: the patches Gentoo carries for it (wrong code, ICEs), as
# reviewed on 12.11.2026 (docs/distro-patches-gentoo-2026-11-12.md of azsupport/azsupport).
github gentoo/gcc-patches@master  fc8560db8288  lang/php84

# kibana6: textproc/kibana6 of azsupport/ports compiles into re2.node (node-re2
# 1.27.1, Timelion's labels) the RE2 2025-11-05 and abseil 20260817.0 that node-re2
# vendors (aZ, 12.11.2026: no port of RE2 or abseil; RE2_VERSION, RE2_VENDOR_RE2,
# RE2_VENDOR_ABSEIL of its Makefile). node-re2: the commits of its master after the
# one reviewed, its releases among them; the official textproc/kibana8 for the
# node-re2 version FreeBSD builds, devel/re2 and devel/abseil for FreeBSD's patches
# of the two. Gentoo and OpenBSD as of 10.11.2026 (their patches are for their own
# builds); Debian and NVD from the day before the releases built.
github  uhop/node-re2@master  61245253f890  textproc/kibana6   # 1.27.1 (c37b4fc45f6f) and three commits of documents
port    textproc/kibana8      9a69436ea72f  textproc/kibana6   # node-re2 1.27.1 there too
port    devel/re2             9a69436ea72f  textproc/kibana6   # no patches at the pin (9a69436ea7, 12.11.2026)
port    devel/abseil          9a69436ea72f  textproc/kibana6   # a4950fba (in 20260817.0) and one for PowerPC
gentoo  dev-libs/re2          2026-11-10    textproc/kibana6
gentoo  dev-cpp/abseil-cpp    2026-11-10    textproc/kibana6
openbsd textproc/re2          2026-11-10    textproc/kibana6
openbsd devel/abseil-cpp      2026-11-10    textproc/kibana6
debian  re2                   2025-11-04    textproc/kibana6
debian  abseil                2026-08-17    textproc/kibana6
cve     re2                   2025-11-04    textproc/kibana6
cve     abseil                2026-08-17    textproc/kibana6

# Python and Perl: lang/python312 and lang/perl5.42 of azsupport/ports under the names
# of the official packages, python312 and perl5 (aZ, 11.11.2026), so that the py312-*
# and p5-* packages of the FreeBSD repository work with them. When the ports tree
# switches its default version, the packages built after it take the new one.
default PYTHON_DEFAULT          3.12          lang/python312
default PERL5_DEFAULT           5.42          lang/perl5.42

