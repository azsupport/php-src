# The libraries of /usr/local/az: builds of FreeBSD ports in two trees. Since
# 08.11.2026 they are the package az of azsupport/ports (its port az/az, with a
# copy of this file, az/az/files/deps.conf, and tools/az-build.sh); this file is
# what tools/upstream-check.py and tools/deps-take-check.sh read.
# The static tree /usr/local/az/static (lib/, include/, bin/): static and
# position independent archives; PHP built against them on a server (php,
# php-fpm, libphp.so; tools/config-check.sh, tools/az-menu.sh), the static PHP
# packages and the programs of the fork (FreeBSD ports too: FFmpeg,
# freebsd/ffmpeg.conf; ImageMagick 6 and 7, freebsd/imagemagick.conf; curl,
# below) link them in and need no library of /usr/local/lib. The shared tree
# /usr/local/az (lib/, include/, bin/): shared libraries with their
# SONAME and the run path /usr/local/az/lib, for the PHP modules of pkg
# mode (one package per extension, built with phpize). Two trees, because the
# linker takes libfoo.so before libfoo.a of one directory (a static build would
# become dynamic without a word), and the static tree has the headers of the
# OpenSSL of the port, which the shared builds (the OpenSSL of the base system)
# must not see. Every library is built once per kind, for all of them, from the
# ports commit below (also that of ffmpeg.conf and imagemagick.conf).
#
#   ports <commit>         the freebsd-ports commit the libraries and the programs
#                          come from: their versions, distfiles and checksums
#                          (distinfo) and patches
#   lib <name> <port> <kinds>
#                          one library, in build order (later ones use earlier ones);
#                          <kinds> is static, shared or static,shared: static into
#                          the static tree /usr/local/az/static (the archives
#                          the static PHP, FFmpeg, ImageMagick and curl link in),
#                          shared into the shared tree /usr/local/az (lib/*.so
#                          with their run path, for the PHP modules of pkg mode, built
#                          with phpize against the core package), against the
#                          OpenSSL of the base system. Static only: OpenSSL (the
#                          shared tree takes the base one), libevent, PCRE2 (PHP
#                          has the PCRE2 the fork bundles into ext/pcre), PCRE1,
#                          x264 (FFmpeg only)
#   lib <name> bundle <kinds>
#                          a library of the bundled curl (--with-curl=bundled): the
#                          release file of freebsd/curl-deps.conf (curl:
#                          freebsd/curl.conf), built by freebsd/curl/build-libcurl.sh,
#                          so that both have the same ones; libcurl.a takes them in
#                          with their symbols local, they stay for the others
#                          (libzip: zstd)
#   program curl           the package curl (bin/curl, lib/libcurl.so.4 of
#                          /usr/local, in the place of that of the port): a build
#                          of its own of the release of the bundled curl, with the
#                          options of the port ftp/curl, against these libraries;
#                          the curl of PHP stays the static libcurl.a above (in
#                          az), with only what PHP needs
#   take <name> <version> <release file> <SHA-256> <source dir>
#                          (<release file>: one address, or several of the same file
#                          separated by commas, tried in turn)
#                          a new release of the upstream that the port does not have
#                          yet. A new release is taken when its port has it; before
#                          the port only when it fixes a vulnerability that touches
#                          us, or a bug we have (rule of 04.11.2026); the port is
#                          followed for its patches and what FreeBSD needs
#                          (tools/upstream-check.py reports the port's commits after
#                          the commit above). The
#                          ports framework builds the release file instead of its own
#                          distfile (SHA-256 checked against a second source when it
#                          is taken), with the port's patches, or with those of
#                          freebsd/deps/<name>-<version>/ when there is that
#                          directory; <source dir> is the source tree inside the
#                          extracted release (WRKSRC). Once the port has the version,
#                          the line goes (the check reports it).
#   upstream <name> <version> <releases> [<pattern> [<series>]]
#                          where tools/upstream-check.py looks for new releases of a
#                          library, and the version built now (that of the port or of
#                          its take line): a git repository (its tags, with <pattern>
#                          a regular expression whose group 1 is the version) or a
#                          directory listing ending in "/" (the names in it that match
#                          <pattern>; a group "patch" is a patch level of <series>);
#                          <series> keeps the check to one series (OpenSSL 3.5, the LTS
#                          of the port)
#
# Base system libraries are used as they are: libz, libbz2, libncursesw, libc++,
# libthr, libm. OpenSSL of the static tree is the port (3.5 LTS), built in with
# its legacy provider (RC4, DES, Blowfish, RC2, CAST5, MD4) and with OPENSSLDIR
# /etc/ssl, the CA store and openssl.cnf of the base system; the shared tree
# takes the OpenSSL of the base system (libssl and libcrypto of /usr/lib and
# /lib). JPEG is graphics/mozjpeg, as JPEG_PORT in
# /etc/make.conf of the servers. fontconfig takes its configuration, fonts and
# cache from the system (/usr/local/etc/fonts, /usr/local/share/fonts,
# /var/db/fontconfig), as the port does.

# freebsd-ports main of 04.11.2026: ImageMagick7 7.1.2-34 and ImageMagick6
# 6.9.13-59 fix the vulnerabilities of the FreeBSD VuXML entry of 26.10.2026
# ("ImageMagick7 -- multiple vulnerabilities"); the ports of the libraries are the
# same as at 0c418eb554 (22.10.2026), but for expat2 2.10.0 and dav1d (PORTREVISION).
ports f16b6dd0f7c1c3a2e0447e192e39e72f21d85eb0

lib openssl       security/openssl         static
lib libiconv      converters/libiconv      static,shared
lib c-ares        bundle                   static,shared
lib libidn2       bundle                   static,shared
lib libpsl        bundle                   static,shared
lib nghttp2       bundle                   static,shared
lib brotli        bundle                   static,shared
lib zstd          bundle                   static,shared
lib lz4           archivers/liblz4         static,shared
lib libxml2       textproc/libxml2         static,shared
lib icu           devel/icu                static,shared
lib oniguruma     devel/oniguruma          static,shared
lib libzip        archivers/libzip         static,shared
lib png           graphics/png             static,shared
lib mozjpeg       graphics/mozjpeg         static,shared
lib webp          graphics/webp            static,shared
lib freetype2     print/freetype2          static,shared
lib gd            graphics/gd              static,shared
lib libmcrypt     security/libmcrypt       static,shared
lib libevent      devel/libevent           static
lib libmemcached  databases/libmemcached   static,shared
lib libsodium     security/libsodium       static,shared
lib argon2        security/libargon2       static,shared
lib pcre2         devel/pcre2              static
lib pcre          devel/pcre               static
lib readline      devel/readline           static,shared
lib gettext       devel/gettext-runtime    static,shared
lib curl          bundle                   static,shared
# for ImageMagick (text, colour profiles, HEIC and AVIF) and FFmpeg (H.264, AV1)
lib expat         textproc/expat2          static,shared
lib fontconfig    x11-fonts/fontconfig     static,shared
lib lcms2         graphics/lcms2           static,shared
lib x264          multimedia/libx264       static
lib dav1d         multimedia/dav1d         static,shared
lib libde265      multimedia/libde265      static,shared
lib libheif       graphics/libheif         static,shared
# shared only, for the PHP modules of pkg mode: sqlite3 and pdo_sqlite, gmp, xsl,
# ffi, tidy (aZ 08.11.2026)
lib sqlite3       databases/sqlite3        shared
lib gmp           math/gmp                 shared
lib libxslt       textproc/libxslt         shared
lib libffi        devel/libffi             shared
lib tidy          www/tidy-html5           shared

program curl

# Prepared on 04.11.2026, not used: releases ahead of their port (the port has
# ICU 76.1, FreeType 2.14.3 and libiconv 1.18) that fix no vulnerability touching
# us (none in FreeBSD VuXML for the versions of the ports). A candidate built with
# them (phpdeps-fbsd15-candidate) passed the build test of every branch; not
# published. Kept for a security release: uncomment the line (and set the version
# of its upstream line). SHA-256: ICU and FreeType as in the icu4c@79 and freetype
# formulas of Homebrew, ICU also of the file of the release on GitHub; libiconv as
# in the libiconv formula of Homebrew; freebsd/deps/libiconv-1.19.1/ has the
# patches of the port brought up to 1.19.1.
#take icu          79.1     https://github.com/unicode-org/icu/releases/download/release-79.1/icu4c-79.1-sources.tgz  06fa63ecb521048f8082f12ad988f6b678d90cbd88aafce24cbc94902b191d99  icu/source
#take freetype2    2.15.0   https://download.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.xz,https://downloads.sourceforge.net/project/freetype/freetype2/2.15.0/freetype-2.15.0.tar.xz  93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5  freetype-2.15.0
#take libiconv     1.19.1   https://ftp.gnu.org/gnu/libiconv/libiconv-1.19.1.tar.gz,https://ftpmirror.gnu.org/libiconv/libiconv-1.19.1.tar.gz  9a06844846d664d7122161700c10a64480d7c7bcead3091925a785b38c91edab  libiconv-1.19.1

# Taken on 08.11.2026 before their port, for security fixes in what the sites read
# (HEIC and AVIF): libheif 1.23.7 (16 GHSA in reading HEIF and AVIF) and libde265
# 1.1.3 (GHSA-mm7m-v26f-wf8x, GHSA-vm5w-mrw5-q329, GHSA-xp3h-6f5r-8cxp in the HEVC
# decoder). SHA-256 as in the libheif and libde265 formulas of Homebrew (the same
# release file as the port's); the port's patches apply (libheif's with an offset).
take libheif      1.23.7   https://github.com/strukturag/libheif/releases/download/v1.23.7/libheif-1.23.7.tar.gz  f7483e818503ea6224c8863e4a56ac02c7089021a98472c811c12aa19faf2475  libheif-1.23.7
take libde265     1.1.3    https://github.com/strukturag/libde265/releases/download/v1.1.3/libde265-1.1.3.tar.gz  554228bd17788c99a7e63b37ab5634722190e6e2bf60c1dcb01cef328e133905  libde265-1.1.3

# Upstream releases of the libraries built from ports (the bundle ones are in
# freebsd/curl-deps.conf). libmcrypt (2.5.8, 2007) and PCRE1 (8.45, 2021) have
# no new releases; x264 has none either (the port follows its stable branch).
upstream openssl      3.5.9     https://github.com/openssl/openssl                 openssl-(\d+\.\d+\.\d+)                3.5
upstream libiconv     1.18      https://ftp.gnu.org/gnu/libiconv/                  libiconv-(\d+(?:\.\d+)+)\.tar\.gz
upstream lz4          1.10.0    https://github.com/lz4/lz4                         v(\d+\.\d+\.\d+)
upstream libxml2      2.15.4    https://gitlab.gnome.org/GNOME/libxml2.git         v(\d+\.\d+\.\d+)
