# The libraries of /usr/local/phpdeps (tools/build-deps.sh, workflow deps.yml):
# static and position independent builds of FreeBSD ports, so that PHP built
# against them (php, php-fpm, libphp.so) needs no library of /usr/local/lib.
#
#   ports <commit>         the freebsd-ports commit the libraries come from: their
#                          versions, distfiles and checksums (distinfo) and patches
#   lib <name> <port>      one library, in build order (later ones use earlier ones)
#   lib <name> bundle      a library of the bundled curl (--with-curl=bundled): the
#                          release file of freebsd/curl-deps.conf (curl:
#                          freebsd/curl.conf), built by freebsd/curl/build-libcurl.sh,
#                          so that both have the same ones; libcurl.a takes them in
#                          with their symbols local, they stay for the others
#                          (libzip: zstd)
#   take <name> <version> <release file> <SHA-256> <source dir>
#                          a new release of the upstream that the port does not have
#                          yet: a new upstream release is taken when it is out,
#                          without waiting for the port, which is followed for its
#                          patches and what FreeBSD needs (tools/upstream-check.py
#                          reports the port's commits after the commit above). The
#                          ports framework builds the release file instead of its own
#                          distfile (SHA-256 checked against a second source when it
#                          is taken), with the port's patches, or with those of
#                          freebsd/deps/<name>-<version>/ when there is that
#                          directory; <source dir> is the source tree inside the
#                          extracted release (WRKSRC). Once the port has the version,
#                          the line goes (the check reports it).
#   upstream <name> <version> <releases> [<pattern> [<series>]]
#                          where tools/upstream-check.py looks for new releases of a
#                          library, and the version built now (that of the port or of
#                          its take line): a git repository (its tags, with <pattern>
#                          a regular expression whose group 1 is the version) or a
#                          directory listing ending in "/" (the names in it that match
#                          <pattern>; a group "patch" is a patch level of <series>);
#                          <series> keeps the check to one series (OpenSSL 3.5, the LTS
#                          of the port)
#
# Base system libraries are used as they are: libz, libbz2, libncursesw, libc++,
# libthr, libm. OpenSSL is the port (3.5 LTS), built in with its legacy provider
# (RC4, DES, Blowfish, RC2, CAST5, MD4) and with OPENSSLDIR /etc/ssl, the CA store
# and openssl.cnf of the base system. JPEG is graphics/mozjpeg, as JPEG_PORT in
# /etc/make.conf of the servers.

ports 0c418eb55443194a668dc10641d979bf8bc05647

lib openssl       security/openssl
lib libiconv      converters/libiconv
lib c-ares        bundle
lib libidn2       bundle
lib libpsl        bundle
lib nghttp2       bundle
lib brotli        bundle
lib zstd          bundle
lib lz4           archivers/liblz4
lib libxml2       textproc/libxml2
lib icu           devel/icu
lib oniguruma     devel/oniguruma
lib libzip        archivers/libzip
lib png           graphics/png
lib mozjpeg       graphics/mozjpeg
lib webp          graphics/webp
lib freetype2     print/freetype2
lib gd            graphics/gd
lib libmcrypt     security/libmcrypt
lib libevent      devel/libevent
lib libmemcached  databases/libmemcached
lib libsodium     security/libsodium
lib argon2        security/libargon2
lib pcre2         devel/pcre2
lib pcre          devel/pcre
lib readline      devel/readline
lib gettext       devel/gettext-runtime
lib curl          bundle

# Releases taken before their port (04.11.2026: the port still has ICU 76.1,
# FreeType 2.14.3 and libiconv 1.18). SHA-256: ICU and FreeType as in the
# icu4c@79 and freetype formulas of Homebrew, ICU also of the file of the release
# on GitHub; libiconv as in the libiconv formula of Homebrew.
take icu          79.1     https://github.com/unicode-org/icu/releases/download/release-79.1/icu4c-79.1-sources.tgz  06fa63ecb521048f8082f12ad988f6b678d90cbd88aafce24cbc94902b191d99  icu/source
take freetype2    2.15.0   https://download.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.xz  93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5  freetype-2.15.0
take libiconv     1.19.1   https://ftp.gnu.org/gnu/libiconv/libiconv-1.19.1.tar.gz  9a06844846d664d7122161700c10a64480d7c7bcead3091925a785b38c91edab  libiconv-1.19.1

# Upstream releases of the libraries built from ports (the bundle ones are in
# freebsd/curl-deps.conf). libmcrypt (2.5.8, 2007) and PCRE1 (8.45, 2021) have
# no new releases.
upstream openssl      3.5.9     https://github.com/openssl/openssl                 openssl-(\d+\.\d+\.\d+)                3.5
upstream libiconv     1.19.1    https://ftp.gnu.org/gnu/libiconv/                  libiconv-(\d+(?:\.\d+)+)\.tar\.gz
upstream lz4          1.10.0    https://github.com/lz4/lz4                         v(\d+\.\d+\.\d+)
upstream libxml2      2.15.4    https://gitlab.gnome.org/GNOME/libxml2.git         v(\d+\.\d+\.\d+)
upstream icu          79.1      https://github.com/unicode-org/icu                 release-(\d+[.-]\d+(?:[.-]\d+)?)
upstream oniguruma    6.9.10    https://github.com/kkos/oniguruma                  v(\d+\.\d+\.\d+)
upstream libzip       1.12.1    https://github.com/nih-at/libzip                   v(\d+\.\d+(?:\.\d+)?)
upstream png          1.6.59    https://github.com/pnggroup/libpng                 v(1\.6\.\d+)
upstream mozjpeg      4.1.5     https://github.com/mozilla/mozjpeg                 v(\d+\.\d+\.\d+)
upstream webp         1.6.0     https://chromium.googlesource.com/webm/libwebp     v(\d+\.\d+\.\d+)
upstream freetype2    2.15.0    https://gitlab.freedesktop.org/freetype/freetype.git  VER-(\d+-\d+-\d+)
upstream gd           2.3.3     https://github.com/libgd/libgd                     gd-(\d+\.\d+\.\d+)
upstream libevent     2.1.13    https://github.com/libevent/libevent               release-(\d+\.\d+\.\d+)-stable
upstream libmemcached 1.1.4     https://github.com/awesomized/libmemcached         (\d+\.\d+\.\d+)
upstream libsodium    1.0.22    https://github.com/jedisct1/libsodium              (\d+\.\d+\.\d+)(?:-RELEASE)?
upstream argon2       20190702  https://github.com/P-H-C/phc-winner-argon2         (\d{8})
upstream pcre2        10.49     https://github.com/PCRE2Project/pcre2              pcre2-(\d+\.\d+)
