# The libraries of /usr/local/phpdeps (tools/build-deps.sh, workflow deps.yml):
# static and position independent builds of FreeBSD ports, so that PHP built
# against them (php, php-fpm, libphp.so) needs no library of /usr/local/lib.
#
#   ports <commit>         the freebsd-ports commit the libraries come from: their
#                          versions, distfiles and checksums (distinfo) and patches
#   lib <name> <port>      one library, in build order (later ones use earlier ones)
#
# Base system libraries are used as they are: libz, libbz2, libncursesw, libc++,
# libthr, libm. OpenSSL is the port (3.5 LTS), built in with its legacy provider
# (RC4, DES, Blowfish, RC2, CAST5, MD4) and with OPENSSLDIR /etc/ssl, the CA store
# and openssl.cnf of the base system. JPEG is graphics/mozjpeg, as JPEG_PORT in
# /etc/make.conf of the servers.

ports 0c418eb55443194a668dc10641d979bf8bc05647

lib openssl       security/openssl
lib libiconv      converters/libiconv
lib libunistring  devel/libunistring
lib libidn2       dns/libidn2
lib libpsl        dns/libpsl
lib nghttp2       www/libnghttp2
lib brotli        archivers/brotli
lib zstd          archivers/zstd
lib lz4           archivers/liblz4
lib libxml2       textproc/libxml2
lib icu           devel/icu
lib oniguruma     devel/oniguruma
lib libzip        archivers/libzip
lib png           graphics/png
lib mozjpeg       graphics/mozjpeg
lib webp          graphics/webp
lib freetype2     print/freetype2
lib gd            graphics/gd
lib libmcrypt     security/libmcrypt
lib libevent      devel/libevent
lib libmemcached  databases/libmemcached
lib libsodium     security/libsodium
lib argon2        security/libargon2
lib pcre2         devel/pcre2
lib pcre          devel/pcre
lib readline      devel/readline
lib gettext       devel/gettext-runtime
lib curl          ftp/curl
